<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPOW! Comics — The Adventures of Captain Teapot</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --y:#ffd400; --r:#e8232a; --b:#1f5fd6; --k:#111; --paper:#fdf6e3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--y); color:var(--k); font-family:'Comic Neue',sans-serif; font-weight:700; background-image:radial-gradient(#e8a600 22%,transparent 24%); background-size:14px 14px; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .bang { font-family:'Bangers',cursive; letter-spacing:.04em; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 4vw; background:var(--r); border-bottom:6px solid var(--k); flex-wrap:wrap; gap:10px; }
  .logo { font-family:'Bangers'; font-size:44px; color:var(--y); -webkit-text-stroke:2px var(--k); text-shadow:4px 4px 0 var(--k); transform:rotate(-3deg); }
  nav { display:flex; gap:8px; flex-wrap:wrap; }
  nav a { font-family:'Bangers'; font-size:20px; letter-spacing:.06em; padding:6px 14px; background:#fff; border:4px solid var(--k); box-shadow:4px 4px 0 var(--k); transform:rotate(-1deg); }
  nav a:nth-child(even) { transform:rotate(1.5deg); }
  nav a.on { background:var(--y); }
  [data-view][hidden] { display:none; }
  .wrap { max-width:1200px; margin:0 auto; padding:26px 3vw 60px; }
  /* comic page */
  .page { background:var(--paper); border:6px solid var(--k); box-shadow:12px 12px 0 var(--k); padding:14px; display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:220px; gap:12px; position:relative; transition:transform .6s cubic-bezier(.6,0,.3,1); transform-origin:left center; }
  .page.flip { transform:perspective(1600px) rotateY(-100deg); }
  .panel { border:5px solid var(--k); position:relative; overflow:hidden; background:#fff; cursor:zoom-in; }
  .panel svg { width:100%; height:100%; display:block; }
  .panel.focus { outline:8px solid var(--r); z-index:5; }
  .cap { position:absolute; top:6px; left:6px; background:var(--y); border:3px solid var(--k); padding:4px 8px; font-size:14px; max-width:70%; line-height:1.2; }
  .bub { position:absolute; background:#fff; border:3px solid var(--k); border-radius:50%; padding:12px 16px; font-size:15px; line-height:1.15; text-align:center; max-width:60%; }
  .bub::after { content:''; position:absolute; width:22px; height:22px; background:#fff; border-right:3px solid var(--k); border-bottom:3px solid var(--k); transform:rotate(45deg) skew(12deg,12deg); bottom:-10px; left:30%; }
  .sfx { position:absolute; font-family:'Bangers'; color:var(--y); -webkit-text-stroke:2px var(--k); text-shadow:4px 4px 0 var(--r); transform:rotate(-12deg); pointer-events:none; }
  .ctl { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:26px; flex-wrap:wrap; }
  .btn { font-family:'Bangers'; font-size:22px; letter-spacing:.06em; padding:8px 18px; background:#fff; border:4px solid var(--k); box-shadow:5px 5px 0 var(--k); cursor:pointer; transition:transform .1s, box-shadow .1s; }
  .btn:active { transform:translate(4px,4px); box-shadow:1px 1px 0 var(--k); }
  .btn.r { background:var(--r); color:#fff; } .btn.b { background:var(--b); color:#fff; }
  .guided { position:fixed; inset:0; z-index:50; background:#111e; display:grid; place-items:center; padding:20px; }
  .guided[hidden] { display:none; }
  .guided .stage { width:min(900px,94vw); aspect-ratio:1.5; border:8px solid #fff; background:#fff; position:relative; overflow:hidden; animation:zoomIn .5s cubic-bezier(.3,1.4,.5,1); }
  @keyframes zoomIn { from { transform:scale(.6); opacity:0; } }
  .guided .gctl { position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:10px; }
  /* characters */
  .chars { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .char { background:#fff; border:5px solid var(--k); box-shadow:8px 8px 0 var(--k); transition:transform .2s; }
  .char:hover { transform:rotate(-1.5deg) scale(1.02); }
  .char .art { height:240px; border-bottom:5px solid var(--k); position:relative; overflow:hidden; }
  .char .art svg { width:100%; height:100%; }
  .char .in { padding:14px 16px; }
  .char h3 { font-family:'Bangers'; font-size:2rem; letter-spacing:.04em; }
  .char .tag { font-size:14px; color:#555; }
  .stat { display:grid; grid-template-columns:80px 1fr; gap:6px; align-items:center; margin:6px 0; font-size:13px; }
  .stat i { height:14px; border:3px solid var(--k); background:#fff; }
  .stat i b { display:block; height:100%; background:var(--r); }
  /* maker */
  .maker { display:grid; grid-template-columns:300px 1fr; gap:24px; }
  .tools { background:#fff; border:5px solid var(--k); box-shadow:8px 8px 0 var(--k); padding:16px; }
  .tools h4 { font-family:'Bangers'; font-size:1.4rem; margin:12px 0 6px; }
  .tools h4:first-child { margin-top:0; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opts button { font-family:'Comic Neue'; font-weight:700; padding:6px 10px; border:3px solid var(--k); background:#fff; cursor:pointer; }
  .opts button.on { background:var(--y); }
  .tools input { width:100%; border:3px solid var(--k); padding:8px; font-family:inherit; font-weight:700; font-size:15px; }
  .canvas { position:relative; aspect-ratio:1.4; border:6px solid var(--k); background:#fff; box-shadow:12px 12px 0 var(--k); overflow:hidden; }
  .canvas svg.bg { position:absolute; inset:0; width:100%; height:100%; }
  .canvas .drag { position:absolute; cursor:move; user-select:none; touch-action:none; }
  .canvas .drag.sel { outline:3px dashed var(--b); outline-offset:4px; }
  .canvas .drag svg { width:140px; height:180px; display:block; }
  /* store */
  .issues { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .issue { background:#fff; border:5px solid var(--k); box-shadow:8px 8px 0 var(--k); cursor:pointer; transition:transform .2s; }
  .issue:hover { transform:translateY(-6px) rotate(1deg); }
  .issue .cov { aspect-ratio:2/3; border-bottom:5px solid var(--k); position:relative; overflow:hidden; }
  .issue .cov svg { width:100%; height:100%; }
  .issue .in { padding:10px 12px; display:flex; justify-content:space-between; align-items:center; font-family:'Bangers'; font-size:20px; }
  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%) scale(0) rotate(-10deg); z-index:60; font-family:'Bangers'; font-size:5rem; color:var(--y); -webkit-text-stroke:3px var(--k); text-shadow:6px 6px 0 var(--r); pointer-events:none; transition:transform .3s cubic-bezier(.3,1.8,.5,1); }
  .toast.show { transform:translate(-50%,-50%) scale(1) rotate(-10deg); }
  @media (max-width:900px){ .page { grid-template-columns:1fr 1fr; grid-auto-rows:180px; } .page .panel { grid-column:span 2 !important; } .chars,.issues { grid-template-columns:1fr 1fr; } .maker { grid-template-columns:1fr; } }
</style>
<script>if(window===window.top)document.head.appendChild(Object.assign(document.createElement("script"),{defer:true,src:"/_vercel/insights/script.js"}))</script>
</head>
<body>
<header><div class="logo">KAPOW! COMICS</div><nav><a href="#read">Read</a><a href="#heroes">Heroes</a><a href="#maker">Make a panel</a><a href="#shop">Back issues</a><a href="index.html">← Index</a></nav></header>

<section data-view="read" class="wrap">
  <div class="page" id="page"></div>
  <div class="ctl"><button class="btn" id="prevP">◀ BACK</button><span class="bang" style="font-size:24px" id="pgN"></span><button class="btn" id="nextP">NEXT ▶</button><button class="btn r" id="guide">▶ GUIDED VIEW</button></div>
</section>

<section data-view="heroes" class="wrap" hidden><div class="chars" id="chars"></div></section>

<section data-view="maker" class="wrap" hidden>
  <div class="maker">
    <div class="tools"><h4>Background</h4><div class="opts" id="bgs"></div><h4>Add a character</h4><div class="opts" id="addC"></div><h4>Add a bubble</h4><input id="bText" value="Great Scott!" maxlength="40"><div class="opts" style="margin-top:6px"><button id="addB">+ Speech</button><button id="addT">+ Thought</button><button id="addS">+ SFX</button></div><h4>Selected</h4><div class="opts"><button id="big">Bigger</button><button id="small">Smaller</button><button id="flipX">Flip</button><button id="del">Delete</button></div><button class="btn b" id="save" style="margin-top:14px;width:100%">SAVE PNG-ISH (SVG)</button></div>
    <div class="canvas" id="canvas"><svg class="bg" id="bgSvg" viewBox="0 0 700 500" preserveAspectRatio="none"></svg></div>
  </div>
</section>

<section data-view="shop" class="wrap" hidden><div class="issues" id="issues"></div></section>
<div class="guided" id="guided" hidden><div class="stage" id="gstage"></div><div class="gctl"><button class="btn" id="gPrev">◀</button><button class="btn r" id="gClose">CLOSE</button><button class="btn" id="gNext">▶</button></div></div>
<div class="toast" id="toast">POW!</div>

<script>
const V=[...document.querySelectorAll('[data-view]')];
function go(id){id=V.some(v=>v.dataset.view===id)?id:'read';V.forEach(v=>v.hidden=v.dataset.view!==id);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));try{history.replaceState(null,'','#'+id)}catch(e){}}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1))}});
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),700);boom()};
let AC;function boom(){try{AC=AC||new AudioContext();const t=AC.currentTime;const b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,2);const s=AC.createBufferSource(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;s.buffer=b;s.connect(f);f.connect(AC.destination);s.start(t)}catch(e){}}

/* character art */
const HERO={teapot:(c='#1f5fd6')=>`<g><ellipse cx="70" cy="178" rx="40" ry="6" fill="#0003"/><rect x="50" y="120" width="12" height="55" fill="#111"/><rect x="78" y="120" width="12" height="55" fill="#111"/><path d="M30 70 Q30 130 70 130 Q110 130 110 70Z" fill="${c}" stroke="#111" stroke-width="4"/><path d="M110 80 Q135 76 130 55" fill="none" stroke="#111" stroke-width="8"/><path d="M30 86 Q12 86 14 104 Q16 118 32 112" fill="none" stroke="#111" stroke-width="7"/><rect x="40" y="58" width="60" height="14" rx="6" fill="#e8232a" stroke="#111" stroke-width="4"/><circle cx="70" cy="50" r="8" fill="#ffd400" stroke="#111" stroke-width="3"/><rect x="46" y="80" width="48" height="14" rx="7" fill="#111"/><circle cx="58" cy="87" r="4" fill="#fff"/><circle cx="82" cy="87" r="4" fill="#fff"/><path d="M58 106 Q70 114 82 106" stroke="#111" stroke-width="4" fill="none"/><path d="M30 100 L0 70 L6 64" stroke="#e8232a" stroke-width="6" fill="none"/></g>`,
 kettle:(c='#555')=>`<g><ellipse cx="70" cy="178" rx="40" ry="6" fill="#0003"/><path d="M26 60 L114 60 L120 150 L20 150Z" fill="${c}" stroke="#111" stroke-width="4"/><path d="M40 60 Q70 20 100 60" fill="none" stroke="#111" stroke-width="6"/><path d="M114 90 L140 70" stroke="#111" stroke-width="10"/><path d="M40 90 L60 100 M100 90 L80 100" stroke="#111" stroke-width="5"/><circle cx="54" cy="108" r="6" fill="#e8232a"/><circle cx="86" cy="108" r="6" fill="#e8232a"/><path d="M50 130 Q70 118 90 130" stroke="#111" stroke-width="4" fill="none"/><rect x="40" y="150" width="12" height="25" fill="#111"/><rect x="88" y="150" width="12" height="25" fill="#111"/></g>`,
 cup:(c='#ff7eb6')=>`<g><ellipse cx="70" cy="178" rx="34" ry="5" fill="#0003"/><path d="M36 80 L104 80 L96 150 L44 150Z" fill="${c}" stroke="#111" stroke-width="4"/><path d="M104 96 Q126 96 122 118 Q118 136 98 132" fill="none" stroke="#111" stroke-width="6"/><ellipse cx="70" cy="80" rx="34" ry="8" fill="#8a5231" stroke="#111" stroke-width="3"/><circle cx="58" cy="108" r="4" fill="#111"/><circle cx="82" cy="108" r="4" fill="#111"/><path d="M60 124 Q70 130 80 124" stroke="#111" stroke-width="3" fill="none"/><path d="M60 70 q-6 -14 4 -24 M80 70 q6 -14 -4 -24" stroke="#999" stroke-width="3" fill="none"/><rect x="50" y="150" width="10" height="25" fill="#111"/><rect x="80" y="150" width="10" height="25" fill="#111"/><path d="M30 40 L50 30 L40 50Z" fill="#ffd400" stroke="#111" stroke-width="2"/></g>`,
 spoon:(c='#c0c0c0')=>`<g><ellipse cx="70" cy="178" rx="30" ry="5" fill="#0003"/><ellipse cx="70" cy="60" rx="26" ry="36" fill="${c}" stroke="#111" stroke-width="4"/><rect x="64" y="94" width="12" height="80" rx="5" fill="${c}" stroke="#111" stroke-width="4"/><circle cx="60" cy="56" r="5" fill="#111"/><circle cx="80" cy="56" r="5" fill="#111"/><path d="M58 76 Q70 70 82 76" stroke="#111" stroke-width="3" fill="none"/><path d="M44 36 L96 36" stroke="#111" stroke-width="6"/><path d="M64 120 L30 100 M76 120 L110 140" stroke="#111" stroke-width="5"/></g>`};
const hero=(k,c,flip=false)=>`<g transform="${flip?'translate(140 0) scale(-1 1)':''}">${HERO[k](c)}</g>`;
const BG={city:`<rect width="700" height="500" fill="#8fd3ff"/>${[...Array(9)].map((_,i)=>`<rect x="${i*80-10}" y="${220-(i*47)%120}" width="70" height="${300+(i*47)%120}" fill="${['#1f5fd6','#e8232a','#ffd400','#111'][i%4]}" stroke="#111" stroke-width="4"/>${[...Array(6)].map((_,k)=>`<rect x="${i*80+4}" y="${240-(i*47)%120+k*40}" width="14" height="18" fill="#fff" stroke="#111" stroke-width="2"/>`).join('')}`).join('')}<rect y="440" width="700" height="60" fill="#555" stroke="#111" stroke-width="4"/>`,
 kitchen:`<rect width="700" height="500" fill="#fff4c4"/><rect y="300" width="700" height="200" fill="#e8232a" stroke="#111" stroke-width="4"/>${[...Array(7)].map((_,i)=>`<line x1="${i*100}" y1="300" x2="${i*100}" y2="500" stroke="#111" stroke-width="3"/>`).join('')}<rect x="420" y="60" width="200" height="150" fill="#8fd3ff" stroke="#111" stroke-width="5"/><line x1="520" y1="60" x2="520" y2="210" stroke="#111" stroke-width="5"/><circle cx="120" cy="120" r="50" fill="#fff" stroke="#111" stroke-width="5"/><path d="M120 120 L120 85 M120 120 L145 130" stroke="#111" stroke-width="5"/>`,
 space:`<rect width="700" height="500" fill="#1a1040"/>${[...Array(60)].map((_,i)=>`<circle cx="${(i*97)%700}" cy="${(i*61)%500}" r="${1+i%3}" fill="#fff"/>`).join('')}<circle cx="560" cy="120" r="70" fill="#ffd400" stroke="#111" stroke-width="5"/><ellipse cx="560" cy="120" rx="120" ry="20" fill="none" stroke="#e8232a" stroke-width="8"/>`,
 action:`<rect width="700" height="500" fill="#ffd400"/>${[...Array(36)].map((_,i)=>`<path d="M350 250 L${350+Math.cos(i*.1745)*900} ${250+Math.sin(i*.1745)*900} L${350+Math.cos(i*.1745+.087)*900} ${250+Math.sin(i*.1745+.087)*900}Z" fill="${i%2?'#e8232a':'#ffd400'}"/>`).join('')}`};
const panelSVG=(bg,figs=[],vb='0 0 700 500')=>`<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice">${BG[bg]}${figs.map(([k,x,y,s,c,f])=>`<g transform="translate(${x} ${y}) scale(${s})">${hero(k,c,f)}</g>`).join('')}</svg>`;

/* story pages: panels [colspan, bg, figs, caption, bubbles[[text,x%,y%]], sfx[[text,x%,y%,size]]] */
const PAGES=[[[4,'city',[['teapot',260,200,1.3]],'Meanwhile, in Brewtown…',[['Another quiet morning in Brewtown. Too quiet.',50,20]],[]],[2,'kitchen',[['cup',180,230,1.1]],'',[['Captain Teapot! Someone stole the SUGAR!',8,8]],[]],[2,'action',[['kettle',240,160,1.4]],'The villainous Dr. Kettle!',[['Mwahaha! Without sugar, this city will be BITTER forever!',30,6]],[['HISSSS',60,70,54]]],[2,'city',[['teapot',80,190,1.2],['kettle',420,180,1.2,'#555',true]],'',[['Not on my watch, Kettle!',4,6]],[]],[2,'action',[['teapot',120,170,1.3],['kettle',380,170,1.3,'#555',true]],'',[],[['KA-POW!',30,30,80]]]],
 [[3,'space',[['kettle',300,200,1.1]],'Kettle flees to the Moon of Marmalade!',[['You\'ll never catch me in ZERO gravity!',30,8]],[]],[3,'space',[['teapot',260,190,1.2]],'',[['I have a spout, and I\'m not afraid to use it!',10,8]],[['WHOOSH',55,60,60]]],[2,'kitchen',[['spoon',260,190,1.3]],'Meanwhile, Sidekick Spoon…',[['I\'ll stir up some trouble!',20,8]],[]],[4,'action',[['teapot',100,160,1.3],['spoon',300,180,1.1],['kettle',480,150,1.3,'#555',true]],'',[['Surrender the sugar!',2,8],['Never! …oh fine.',62,8]],[['CLANG!',38,60,72]]]],
 [[6,'city',[['teapot',120,190,1.2],['cup',300,230,1],['spoon',460,210,1]],'And so, Brewtown\'s tea was sweet once more.',[['Just the way we like it!',40,6]],[]],[3,'kitchen',[['cup',240,230,1.1]],'',[['Thank you, Captain!',20,8]],[]],[3,'space',[['kettle',280,190,1]],'But somewhere far away…',[['I\'ll be back… with DECAF!',25,8]],[['TO BE CONTINUED',15,72,40]]]]];
let pg=0;const pageEl=document.getElementById('page');
function panelHTML(p,i){const [span,bg,figs,cap,bubs,sfx]=p;return `<div class="panel" data-i="${i}" style="grid-column:span ${span}">${panelSVG(bg,figs)}${cap?`<div class="cap">${cap}</div>`:''}${bubs.map(([t,x,y])=>`<div class="bub" style="left:${x}%;top:${y}%">${t}</div>`).join('')}${sfx.map(([t,x,y,s])=>`<div class="sfx" style="left:${x}%;top:${y}%;font-size:${s}px">${t}</div>`).join('')}</div>`}
function renderPage(){pageEl.innerHTML=PAGES[pg].map(panelHTML).join('');document.getElementById('pgN').textContent=`PAGE ${pg+1} / ${PAGES.length}`}
function turn(d){const n=pg+d;if(n<0||n>=PAGES.length){toast(n<0?'OOF!':'THE END!');return}pageEl.classList.add('flip');setTimeout(()=>{pg=n;renderPage();pageEl.classList.remove('flip');if(PAGES[pg].some(p=>p[5].length))setTimeout(()=>boom(),300)},450)}
document.getElementById('nextP').onclick=()=>turn(1);document.getElementById('prevP').onclick=()=>turn(-1);renderPage();
/* guided view */
let gi=0;const G=document.getElementById('guided');function gShow(){const p=PAGES[pg][gi];document.getElementById('gstage').innerHTML=panelHTML(p,gi).replace('class="panel"','class="panel" style="position:absolute;inset:0;border:0"');const st=document.getElementById('gstage');st.style.animation='none';void st.offsetWidth;st.style.animation='';if(p[5].length)boom()}
document.getElementById('guide').onclick=()=>{gi=0;G.hidden=false;gShow()};pageEl.addEventListener('click',e=>{const p=e.target.closest('.panel');if(!p)return;gi=+p.dataset.i;G.hidden=false;gShow()});
document.getElementById('gNext').onclick=()=>{gi++;if(gi>=PAGES[pg].length){if(pg<PAGES.length-1){pg++;renderPage();gi=0}else{G.hidden=true;toast('THE END!');return}}gShow()};
document.getElementById('gPrev').onclick=()=>{gi=Math.max(0,gi-1);gShow()};document.getElementById('gClose').onclick=()=>G.hidden=true;
addEventListener('keydown',e=>{if(!G.hidden){if(e.key==='ArrowRight')document.getElementById('gNext').click();if(e.key==='ArrowLeft')document.getElementById('gPrev').click();if(e.key==='Escape')G.hidden=true;return}if(V[0].hidden)return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});

/* heroes */
const CH=[['teapot','Captain Teapot','Hero · Brewtown\'s finest',{STRENGTH:7,SPEED:5,STEAM:10,WIT:8},'#1f5fd6','Bitten by a radioactive tea leaf. Always pours before he thinks.'],['cup','Cuppa Jo','Ace reporter',{STRENGTH:3,SPEED:8,STEAM:4,WIT:10},'#ff7eb6','Knows every secret in Brewtown and most of the gossip.'],['spoon','Sidekick Spoon','Loyal stirrer',{STRENGTH:5,SPEED:9,STEAM:2,WIT:6},'#c0c0c0','Gets stuck in the sugar bowl roughly twice per issue.'],['kettle','Dr. Kettle','Villain · evil genius',{STRENGTH:8,SPEED:3,STEAM:10,WIT:9},'#555','Whistles menacingly. Wants a world without sweetness.'],['teapot','Lady Earl Grey','Mysterious ally',{STRENGTH:6,SPEED:7,STEAM:7,WIT:9},'#765ba7','Nobody knows where she came from. Smells faintly of bergamot.'],['cup','The Espresso Kid','Wildcard',{STRENGTH:4,SPEED:10,STEAM:6,WIT:5},'#6b3e26','Very small, very fast, very jittery.']];
document.getElementById('chars').innerHTML=CH.map(([k,n,t,st,c,d],i)=>`<div class="char"><div class="art" style="background:${['#8fd3ff','#ffd400','#fff4c4','#e8232a','#b28cff','#9bc26b'][i]}"><svg viewBox="0 0 140 190">${hero(k,c)}</svg></div><div class="in"><h3>${n}</h3><div class="tag">${t}</div><p style="font-size:14px;margin:6px 0;font-weight:400">${d}</p>${Object.entries(st).map(([s,v])=>`<div class="stat"><span>${s}</span><i><b style="width:${v*10}%;background:${['#e8232a','#1f5fd6','#ffd400','#111'][Object.keys(st).indexOf(s)]}"></b></i></div>`).join('')}</div></div>`).join('');

/* maker */
let bg='city';const bgSvg=document.getElementById('bgSvg'),canvas=document.getElementById('canvas');let selD=null;
document.getElementById('bgs').innerHTML=Object.keys(BG).map(k=>`<button data-bg="${k}" class="${k===bg?'on':''}">${k}</button>`).join('');
document.getElementById('bgs').onclick=e=>{const k=e.target.dataset.bg;if(!k)return;bg=k;bgSvg.innerHTML=BG[k];document.querySelectorAll('#bgs button').forEach(b=>b.classList.toggle('on',b===e.target))};bgSvg.innerHTML=BG[bg];
document.getElementById('addC').innerHTML=CH.slice(0,4).map(([k,n,,,c],i)=>`<button data-c="${i}">${n.split(' ').pop()}</button>`).join('');
function addEl(html,x=30,y=30,kind='char'){const d=document.createElement('div');d.className='drag';d.style.left=x+'%';d.style.top=y+'%';d.dataset.s=1;d.dataset.f=0;d.dataset.kind=kind;d.innerHTML=html;canvas.appendChild(d);pick(d);
 d.addEventListener('pointerdown',e=>{pick(d);const r=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=parseFloat(d.style.left),oy=parseFloat(d.style.top);d.setPointerCapture(e.pointerId);const mv=ev=>{d.style.left=ox+(ev.clientX-sx)/r.width*100+'%';d.style.top=oy+(ev.clientY-sy)/r.height*100+'%'};const up=()=>{d.removeEventListener('pointermove',mv);d.removeEventListener('pointerup',up)};d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up)});return d}
function pick(d){canvas.querySelectorAll('.drag').forEach(x=>x.classList.toggle('sel',x===d));selD=d}
function tf(d){d.style.transform=`scale(${d.dataset.s}) scaleX(${d.dataset.f==1?-1:1})`}
document.getElementById('addC').onclick=e=>{const i=e.target.dataset.c;if(i==null)return;const [k,,,,c]=CH[i];addEl(`<svg viewBox="0 0 140 190">${hero(k,c)}</svg>`,20+Math.random()*50,30+Math.random()*20)};
const txt=()=>(document.getElementById('bText').value||'!').replace(/</g,'');
document.getElementById('addB').onclick=()=>addEl(`<div class="bub" style="position:static;max-width:260px">${txt()}</div>`,20,6,'bub');
document.getElementById('addT').onclick=()=>addEl(`<div class="bub" style="position:static;max-width:260px;border-style:dashed;border-radius:40%">${txt()}</div>`,50,6,'bub');
document.getElementById('addS').onclick=()=>{addEl(`<div class="sfx" style="position:static;font-size:64px">${txt().toUpperCase()}</div>`,35,40,'sfx');boom()};
document.getElementById('big').onclick=()=>{if(!selD)return;selD.dataset.s=(+selD.dataset.s*1.15).toFixed(2);tf(selD)};document.getElementById('small').onclick=()=>{if(!selD)return;selD.dataset.s=(+selD.dataset.s/1.15).toFixed(2);tf(selD)};
document.getElementById('flipX').onclick=()=>{if(!selD)return;selD.dataset.f=selD.dataset.f==1?0:1;tf(selD)};document.getElementById('del').onclick=()=>{if(selD){selD.remove();selD=null}};
addEl(`<svg viewBox="0 0 140 190">${hero('teapot','#1f5fd6')}</svg>`,12,34);addEl(`<div class="bub" style="position:static;max-width:260px">Drag me! Make your own panel!</div>`,30,6,'bub');
document.getElementById('save').onclick=()=>{let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">${BG[bg]}`;const r=canvas.getBoundingClientRect();canvas.querySelectorAll('.drag').forEach(d=>{const x=parseFloat(d.style.left)*7,y=parseFloat(d.style.top)*5,sc=+d.dataset.s;if(d.dataset.kind==='char'){s+=`<g transform="translate(${x} ${y}) scale(${sc*1.2})">${d.querySelector('svg').innerHTML}</g>`}else{const t=d.textContent;s+=d.dataset.kind==='sfx'?`<text x="${x}" y="${y+60}" font-family="Bangers" font-size="${64*sc}" fill="#ffd400" stroke="#111" stroke-width="3">${t}</text>`:`<g transform="translate(${x} ${y})"><ellipse cx="120" cy="30" rx="${Math.min(160,t.length*6+40)}" ry="34" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="36" text-anchor="middle" font-family="Comic Neue" font-weight="700" font-size="16">${t}</text></g>`}});s+='</svg>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.download='my-comic-panel.svg';a.click();toast('SAVED!')};

/* back issues */
const ISS=[['#1','The Spout Awakens','#8fd3ff','teapot',3.5],['#2','Kettle\'s Revenge','#e8232a','kettle',3.5],['#3','Spoon Alone','#ffd400','spoon',3.99],['#4','Cup of Destiny','#b28cff','cup',3.99],['#5','Decaf Dawn','#1a1040','kettle',4.5],['#6','Teapot vs. The World','#9bc26b','teapot',4.5],['#7','Earl Grey Returns','#ff7eb6','teapot',4.99],['#8','Brewtown Burning','#ff9d00','cup',4.99]];
document.getElementById('issues').innerHTML=ISS.map(([n,t,c,k,p],i)=>`<div class="issue" data-i="${i}"><div class="cov" style="background:${c}"><svg viewBox="0 0 200 300"><rect width="200" height="300" fill="${c}"/>${i%2?[...Array(20)].map((_,j)=>`<path d="M100 170 L${100+Math.cos(j*.314)*300} ${170+Math.sin(j*.314)*300} L${100+Math.cos(j*.314+.15)*300} ${170+Math.sin(j*.314+.15)*300}Z" fill="#fff3"/>`).join(''):''}<rect x="0" y="0" width="200" height="54" fill="#e8232a" stroke="#111" stroke-width="4"/><text x="10" y="38" font-family="Bangers" font-size="30" fill="#ffd400" stroke="#111" stroke-width="1.5">KAPOW!</text><text x="190" y="38" text-anchor="end" font-family="Bangers" font-size="26" fill="#fff">${n}</text><g transform="translate(40 90) scale(.9)">${hero(k,k==='kettle'?'#555':k==='cup'?'#ff7eb6':k==='spoon'?'#c0c0c0':'#1f5fd6')}</g><rect x="0" y="252" width="200" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="100" y="284" text-anchor="middle" font-family="Bangers" font-size="${t.length>16?18:22}">${t.toUpperCase()}</text></svg></div><div class="in"><span>${n} · $${p}</span><button class="btn" style="font-size:16px;padding:4px 10px">BUY</button></div></div>`).join('');
document.getElementById('issues').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.textContent='✓ OWNED';toast(['ZAP!','BAM!','WHAM!','POW!'][Math.random()*4|0])};

go(location.hash.slice(1));
</script>
