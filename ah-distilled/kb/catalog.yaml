# AH distilled — catalogue of the knowledge base.
# Single source for structure: books -> sections -> concepts.
# Concept content lives in kb/<book>/<concept>.en.md (primary) and .sl.md (translation).
# Book introductions live in kb/<book>/_book.en.md and _book.sl.md.

books:
  - id: offers
    title: {en: "$100M Offers", sl: "$100M Offers"}
    subtitle: {en: "How to make offers so good people feel stupid saying no", sl: "Kako narediti ponudbe, ki jih je neumno zavrniti"}
    kind: book
    sections:
      - id: problem
        title: {en: "The commodity trap", sl: "Past blaga"}
        concepts: [grand-slam-offer]
      - id: pricing
        title: {en: "Pricing", sl: "Cena"}
        concepts: [starving-crowd, niche, charge-what-its-worth]
      - id: value
        title: {en: "Value", sl: "Vrednost"}
        concepts: [value-equation, problems-solutions, delivery-vehicles, trim-and-stack]
      - id: enhance
        title: {en: "Enhancing the offer", sl: "Ojačanje ponudbe"}
        concepts: [scarcity, urgency, bonuses, guarantees, naming]

  - id: leads
    title: {en: "$100M Leads", sl: "$100M Leads"}
    subtitle: {en: "How to get strangers to want to buy your stuff", sl: "Kako doseči, da neznanci želijo kupiti tvoje stvari"}
    kind: book
    sections:
      - id: understand
        title: {en: "Understanding leads", sl: "Razumevanje leadov"}
        concepts: [engaged-leads, lead-magnets]
      - id: core-four
        title: {en: "The Core Four", sl: "Core Four"}
        concepts: [core-four, warm-outreach, free-content, cold-outreach, paid-ads]
      - id: getters
        title: {en: "Lead getters", sl: "Lead getterji"}
        concepts: [lead-getters]
      - id: start
        title: {en: "Getting started", sl: "Začetek"}
        concepts: [rule-of-100, more-better-new]

  - id: money
    title: {en: "$100M Money Models", sl: "$100M Money Models"}
    subtitle: {en: "How to make money", sl: "Kako zaslužiti denar"}
    kind: book
    sections:
      - id: foundations
        title: {en: "Foundations", sl: "Osnove"}
        concepts: [money-models, client-financed-acquisition]
      - id: offer-types
        title: {en: "The four offer types", sl: "Štirje tipi ponudb"}
        concepts: [attraction-offers, upsell-offers, downsell-offers, continuity-offers]
      - id: assemble
        title: {en: "Putting it together", sl: "Sestavljanje"}
        concepts: [build-your-money-model]

  - id: sales
    title: {en: "Selling & Scaling", sl: "Prodaja in rast"}
    subtitle: {en: "From Alex's talks, trainings and podcast", sl: "Iz Alexovih predavanj, treningov in podcasta"}
    kind: talks
    sections:
      - id: sales
        title: {en: "Sales", sl: "Prodaja"}
        concepts: [closer]
      - id: scaling
        title: {en: "Scaling", sl: "Rast"}
        concepts: [constraint]

