# Texts for the home page (level 0). English first, Slovenian second.
home:
  eyebrow: {en: "Personal study map", sl: "Osebni študijski zemljevid"}
  title: {en: "Alex Hormozi, distilled", sl: "Alex Hormozi, zgoščeno"}
  lede:
    en: "The core business frameworks from $100M Offers, $100M Leads, $100M Money Models and Alex's sales talks, plus a playbook of how he diagnoses and decides, distilled from 103 of his videos. Every concept comes with examples, common mistakes, a worksheet and how Alex himself would apply it."
    sl: "Ključni poslovni okviri iz $100M Offers, $100M Leads, $100M Money Models in Alexovih predavanj o prodaji ter priročnik o tem, kako postavi diagnozo in se odloča, zgoščen iz 103 njegovih videov. Vsak koncept ima primere, pogoste napake, delovni list in opis, kako bi ga uporabil Alex sam."
  books_title: {en: "The books", sl: "Knjige"}
  big_title: {en: "The big ideas", sl: "Velike ideje"}
  big_lede:
    en: "If you only remember a few things, remember these. Each one links to its full page."
    sl: "Če si zapomniš le nekaj stvari, si zapomni te. Vsaka vodi na svojo celotno stran."
  flow_title: {en: "How the books fit together", sl: "Kako se knjige povezujejo"}
  flow:
    - {en: "Offers: make something people feel stupid saying no to.", sl: "Offers: naredi nekaj, kar je neumno zavrniti."}
    - {en: "Leads: get enough of the right people to see it.", sl: "Leads: poskrbi, da to vidi dovolj pravih ljudi."}
    - {en: "Money Models: turn each customer into more cash, faster, so growth pays for itself.", sl: "Money Models: iz vsake stranke naredi več denarja, hitreje, da se rast plača sama."}
    - {en: "Selling & Scaling: close the conversations and fix the one bottleneck that holds you back.", sl: "Prodaja in rast: zaključi pogovore in odpravi edino ozko grlo, ki te zavira."}
    - {en: "Alex's Playbook: how he actually diagnoses a business and decides what to do next, with real cases.", sl: "Alexov priročnik: kako dejansko postavi diagnozo podjetja in se odloči, kaj narediti, z resničnimi primeri."}
  plan_title: {en: "Study plan · 3 weeks", sl: "Učni plan · 3 tedni"}
  plan:
    - {t: {en: "Week 1", sl: "Teden 1"}, en: "$100M Offers (audiobook, about 4 hours). Each evening, apply one concept to your own offer using its worksheet.", sl: "$100M Offers (zvočna knjiga, okoli 4 ure). Vsak večer en koncept uporabi na svoji ponudbi z delovnim listom."}
    - {t: {en: "Week 2", sl: "Teden 2"}, en: "$100M Leads. Pick one Core Four channel and run it for seven days under the Rule of 100.", sl: "$100M Leads. Izberi en kanal iz Core Four in ga sedem dni izvajaj po pravilu 100."}
    - {t: {en: "Week 3", sl: "Teden 3"}, en: "$100M Money Models and the free courses on acquisition.com. Sketch your money model and calculate your 30-day gross profit against CAC.", sl: "$100M Money Models in brezplačni tečaji na acquisition.com. Nariši svoj money model in izračunaj 30-dnevni bruto dobiček glede na CAC."}
    - {t: {en: "Then", sl: "Nato"}, en: "YouTube and the podcast only when you have a specific question.", sl: "YouTube in podcast le, ko imaš konkretno vprašanje."}
  guru_title: {en: "Ask Alex", sl: "Vprašaj Alexa"}
  guru:
    en: "Every concept here doubles as a knowledge base, including how Alex would apply it. Ask Alex is a chatbot that answers business questions briefly, the way Alex would reason, using only this knowledge base and linking to the pages behind each answer. The full knowledge base is also available as one file:"
    sl: "Vsak koncept je hkrati baza znanja, vključno s tem, kako bi ga uporabil Alex. Vprašaj Alexa je klepetalni bot, ki na poslovna vprašanja odgovarja na kratko, kot bi razmišljal Alex, samo iz te baze znanja in s povezavami na strani, iz katerih odgovor izhaja. Celotna baza znanja je na voljo tudi kot ena datoteka:"
  footer:
    en: "A paraphrase for personal study, not affiliated with Alex Hormozi or Acquisition.com. Examples are invented. See the original books for exact definitions."
    sl: "Parafraza za osebno učenje, brez povezave z Alexom Hormozijem ali Acquisition.com. Primeri so izmišljeni. Za točne definicije glej izvirne knjige."
