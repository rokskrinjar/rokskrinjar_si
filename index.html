<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rok Skrinjar</title>
  <meta name="description" content="Projects and experiments by Rok Skrinjar.">
  <style>
    :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#fff; --border:#e5e5e5; --accent:#0b6bcb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1a1a1a; --border:#2a2a2a; --accent:#5aa9ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,sans-serif; line-height:1.5; }
    main { max-width:760px; margin:0 auto; padding:64px 16px; }
    h1 { margin:0 0 4px; font-size:2rem; }
    .lead { color:var(--muted); margin:0 0 40px; }
    .grid { display:grid; gap:12px; }
    a.card { display:block; padding:16px 18px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:inherit; text-decoration:none; transition:border-color .15s; }
    a.card:hover { border-color:var(--accent); }
    .card h2 { margin:0 0 4px; font-size:1.05rem; }
    .card p { margin:0; color:var(--muted); font-size:.95rem; }
    .meta { margin-top:8px; font-size:.8rem; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; }
    .tag { border:1px solid var(--border); border-radius:999px; padding:0 8px; }
    footer { margin-top:48px; font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Rok Skrinjar</h1>
    <p class="lead">Projects and experiments.</p>
    <div id="list" class="grid"><p class="lead">Loading…</p></div>
    <footer>&copy; <span id="y"></span> Rok Skrinjar</footer>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('projects.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(items => {
        const el = document.getElementById('list');
        if (!items.length) { el.innerHTML = '<p class="lead">Nothing here yet — more coming soon.</p>'; return; }
        items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        el.innerHTML = items.map(p => `
          <a class="card" href="${esc(p.slug)}/">
            <h2>${esc(p.title)}</h2>
            <p>${esc(p.description)}</p>
            <div class="meta">${p.date ? `<span>${esc(p.date)}</span>` : ''}${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          </a>`).join('');
      })
      .catch(() => { document.getElementById('list').innerHTML = '<p class="lead">Could not load projects.</p>'; });
  </script>
</body>
</html>
