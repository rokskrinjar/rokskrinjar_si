<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Stack</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none;user-select:none;font-family:Montserrat,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;top:40px;left:0;right:0;text-align:center;pointer-events:none}
.hud b{font-size:72px;font-weight:800;text-shadow:0 4px 20px #0003;display:block;line-height:1}
.hud small{font-weight:300;letter-spacing:.3em;font-size:12px;opacity:.8}
.perfect{position:fixed;top:140px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.3em;opacity:0;transition:opacity .3s;pointer-events:none}
.ov{position:fixed;inset:0;display:none;place-items:end center;padding-bottom:12vh;text-align:center;z-index:5}.ov.on{display:grid}
.ov h1{font-weight:800;font-size:42px;letter-spacing:.1em}.ov p{font-weight:300;letter-spacing:.2em;font-size:13px;margin:8px 0 18px}
button{font:inherit;font-weight:800;letter-spacing:.2em;border:2px solid #fff;background:#ffffff22;color:#fff;padding:12px 30px;border-radius:40px;cursor:pointer}
.back{position:fixed;left:12px;top:10px;color:#fffb;text-decoration:none;font-size:13px;z-index:6}
</style>
<style>html.embed .back,html.embed a.bk{display:none!important}</style><script>try{if(window.self!==window.parent)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}</script>
</head>
<body>
<canvas id="c"></canvas><div class="hud"><b id="s">0</b><small id="bs">BEST 0</small></div><div class="perfect" id="pf">PERFECT</div>
<div class="ov on" id="ov"><div><h1 id="t">SKY STACK</h1><p id="m">TAP OR PRESS SPACE TO DROP</p><button id="go">START</button></div></div>
<a class="back" href="index.html">← games</a>
<script>
const K='best-sky-stack';const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H;
function fit(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);
const BH=1;let st='menu',stack,cur,falling=[],score,best=ls.g(K,0),combo=0,cam=0,camT=0,hue0=Math.random()*360;
document.getElementById('bs').textContent='BEST '+best;
function col(i,shade){return`hsl(${(hue0+i*6)%360},65%,${shade}%)`}
function reset(){stack=[{x:0,z:0,w:10,d:10,y:0}];falling=[];score=0;combo=0;cam=0;camT=0;hue0=Math.random()*360;newBlock()}
function newBlock(){const top=stack[stack.length-1];const axis=stack.length%2?'x':'z';cur={x:top.x,z:top.z,w:top.w,d:top.d,y:top.y+BH,axis,t:0,speed:Math.min(.09,.035+stack.length*.0015)};cur[axis]=-14}
function start(){reset();st='play';document.getElementById('ov').classList.remove('on');document.getElementById('s').textContent=0}
let AC;function tone(f,d=.1,v=.07){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function drop(){const top=stack[stack.length-1],a=cur.axis,size=a==='x'?'w':'d';const delta=cur[a]-top[a];const over=Math.abs(delta);
 if(over>=top[size]){falling.push({...cur,vy:0});gameOver();return}
 if(over<.25){cur[a]=top[a];combo++;const pf=document.getElementById('pf');pf.textContent=combo>2?`PERFECT ×${combo}`:'PERFECT';pf.style.opacity=1;setTimeout(()=>pf.style.opacity=0,500);tone(440*Math.pow(1.06,Math.min(combo,24)),.25);if(combo>=4){cur.w=Math.min(10,cur.w+.5);cur.d=Math.min(10,cur.d+.5)}}
 else{combo=0;const keep=top[size]-over;const cut={...cur};if(delta>0){cut[a]=cur[a]+keep/2+(-top[size]/2)+top[size]-over/2;cur[a]=top[a]+over/2}else{cut[a]=cur[a]-keep/2-over/2+(top[size]-top[size]);cur[a]=top[a]-over/2}
  cut[size]=over;cur[size]=keep;
  // recompute cut position precisely
  const edge=delta>0?top[a]+top[size]/2:top[a]-top[size]/2;cut[a]=edge+Math.sign(delta)*over/2;
  falling.push({...cut,vy:0});tone(220,.12)}
 stack.push({x:cur.x,z:cur.z,w:cur.w,d:cur.d,y:cur.y});score++;document.getElementById('s').textContent=score;camT=Math.max(0,stack.length-6);newBlock()}
function gameOver(){st='over';cur=null;if(score>best){best=score;ls.s(K,best)}document.getElementById('bs').textContent='BEST '+best;tone(110,.5,.1);
 setTimeout(()=>{document.getElementById('t').textContent=score>=best&&score>0?'NEW BEST!':'TOWER DOWN';document.getElementById('m').textContent=`${score} BLOCKS · BEST ${best}`;document.getElementById('go').textContent='AGAIN';document.getElementById('ov').classList.add('on')},600)}
function iso(px,py,pz){const s=Math.min(W,H)/32;return[W/2+(px-pz)*s*.87,H*.62+(px+pz)*s*.5-(py-cam)*s*1.2]}
function box(b,i,alpha=1){const hw=b.w/2,hd=b.d/2,y=b.y;const P=(dx,dz,dy)=>iso(b.x+dx,y+dy,b.z+dz);x.globalAlpha=alpha;
 const top=[P(-hw,-hd,BH),P(hw,-hd,BH),P(hw,hd,BH),P(-hw,hd,BH)],left=[P(-hw,hd,BH),P(hw,hd,BH),P(hw,hd,0),P(-hw,hd,0)],right=[P(hw,-hd,BH),P(hw,hd,BH),P(hw,hd,0),P(hw,-hd,0)];
 [[left,col(i,50)],[right,col(i,40)],[top,col(i,65)]].forEach(([f,c])=>{x.fillStyle=c;x.beginPath();f.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill()});x.globalAlpha=1}
function frame(){const g=x.createLinearGradient(0,0,0,H);const top=stack?stack.length:0;g.addColorStop(0,`hsl(${(hue0+top*6+180)%360},45%,70%)`);g.addColorStop(1,`hsl(${(hue0+top*6+140)%360},50%,40%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
 cam+=(camT-cam)*.08;
 if(!stack)reset();
 if(st==='menu'){cur.t+=.03;cur[cur.axis]=Math.sin(cur.t)*12}
 if(st==='play'&&cur){cur.t+=cur.speed;cur[cur.axis]=-Math.cos(cur.t)*14}
 stack.forEach((b,i)=>{if(b.y>cam-12)box(b,i)});
 if(cur)box(cur,stack.length);
 falling.forEach(f=>{f.vy+=.02;f.y-=f.vy;box(f,Math.round(f.y),Math.max(0,1-(stack[stack.length-1].y-f.y)/14))});falling=falling.filter(f=>f.y>cam-20);
 requestAnimationFrame(frame)}
frame();
function act(){if(st==='play')drop();else if(st!=='play'&&document.getElementById('ov').classList.contains('on'))start()}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();act()}});
cv.addEventListener('pointerdown',act);document.getElementById('go').onclick=e=>{e.stopPropagation();start()};
</script>
</body>
</html>
