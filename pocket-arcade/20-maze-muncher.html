<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maze Muncher</title>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none;user-select:none;background:#1c0a2b;font-family:Sniglet,cursive;color:#ffe3f5}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:15px;pointer-events:none}.hud b{color:#fff;font-weight:800}
.ov{position:fixed;inset:0;display:none;place-items:center;text-align:center;z-index:5;background:#1c0a2bcc}.ov.on{display:grid}
.ov h1{font-size:clamp(44px,12vw,80px);font-weight:800;line-height:.9;color:#ff7bd5;text-shadow:0 5px 0 #8a2a7a,0 0 30px #ff7bd588}
.ov p{margin:16px auto 22px;line-height:1.6;max-width:320px}
button{font:inherit;font-weight:800;font-size:22px;border:0;background:#ffd166;color:#5a2a0a;padding:12px 34px;border-radius:40px;box-shadow:0 6px 0 #c9892a;cursor:pointer}
.back{position:fixed;left:10px;top:30px;color:#ffe3f5aa;text-decoration:none;font-size:13px;z-index:6}
</style>
<style>html.embed .back,html.embed a.bk{display:none!important}</style><script>try{if(window.self!==window.parent)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}</script>
<script>if(window===window.top)document.head.appendChild(Object.assign(document.createElement("script"),{defer:true,src:"/_vercel/insights/script.js"}))</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>SCORE <b id="s">0</b></span><span>LV <b id="lv">1</b></span><span id="l">🍩🍩🍩</span><span>HI <b id="b">0</b></span></div>
<div class="ov on" id="ov"><div><h1 id="t">MAZE<br>MUNCHER</h1><p id="m">Munch every sprinkle. Big sprinkles turn the jellies blue — then munch them too!<br>Arrows / WASD or swipe.</p><button id="go">MUNCH</button></div></div>
<a class="back" href="index.html">← games</a>
<script>
const K='best-maze-muncher';const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const MAP=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.### # ###.####","   #.#   G   #.#   ","####.# ##-## #.####","    .  #GGG#  .    ","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o.#.....P.....#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#","#.................#","###################"];
const C=19,R=21;const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,T,OX,OY;
function fit(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);T=Math.floor(Math.min((W-12)/C,(H-70)/R));OX=Math.floor((W-C*T)/2);OY=Math.floor(40+(H-50-R*T)/2)}fit();addEventListener('resize',fit);
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
let st='menu',grid,dots,pm,ghosts,score,lives,level,best=ls.g(K,0),fright=0,chain=0,mode='scatter',modeT=0,t=0,want=-1,fruit=null,eatenDots=0,readyT=0,parts=[],pops=[];
document.getElementById('b').textContent=best;
let AC;function tone(f,d=.06,type='square',v=.03,to){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(to)o.frequency.exponentialRampToValueAtTime(to,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function cell(cx,cy){if(cy===9&&(cx<0||cx>=C))return ' ';if(cx<0||cy<0||cx>=C||cy>=R)return '#';return grid[cy][cx]}
function open(cx,cy,g){const c=cell(cx,cy);if(c==='#')return false;if(c==='-')return !!(g&&(g.st==='leave'||g.st==='eyes'));return true}
function loadLevel(){grid=MAP.map(r=>r.split(''));dots=0;grid.forEach(r=>r.forEach(c=>{if(c==='.'||c==='o')dots++}));eatenDots=0;fruit=null;reset()}
function reset(){pm={x:9,y:15,d:2,nd:2,mouth:0,moving:true};want=2;const col=['#ff5a5f','#ffa6e0','#5ce1e6','#ffb347'];const home=[[9,7],[9,9],[8,9],[10,9]];const sc=[[C-2,-2],[1,-2],[C-1,R+1],[0,R+1]];
 ghosts=col.map((c,i)=>({x:home[i][0],y:home[i][1],d:i?3:2,col:c,st:i?'house':'active',rel:[0,90,260,440][i]+t,sc:sc[i],id:i}));fright=0;mode='scatter';modeT=0;readyT=90}
function start(){score=0;lives=3;level=1;loadLevel();st='play';document.getElementById('ov').classList.remove('on');hud()}
function hud(){document.getElementById('s').textContent=score;document.getElementById('lv').textContent=level;document.getElementById('l').textContent='🍩'.repeat(Math.max(0,lives));if(score>best){best=score;ls.s(K,best)}document.getElementById('b').textContent=best}
function atCenter(e,sp){return Math.abs(e.x-Math.round(e.x))<sp&&Math.abs(e.y-Math.round(e.y))<sp}
function speedP(){return(.115+Math.min(.03,level*.004))*(fright>0?1.08:1)}
function speedG(g){if(g.st==='eyes')return .26;const tun=Math.round(g.y)===9&&(g.x<4||g.x>14);if(tun)return .055;if(g.fr)return .065;return .105+Math.min(.035,level*.006)}
function movePac(){const sp=speedP();if(want>=0&&(want+2)%4===pm.d){pm.d=want}
 if(atCenter(pm,sp)){const cx=Math.round(pm.x),cy=Math.round(pm.y);if(want>=0&&open(cx+DIRS[want][0],cy+DIRS[want][1]))pm.d=want;if(!open(cx+DIRS[pm.d][0],cy+DIRS[pm.d][1])){pm.x=cx;pm.y=cy;pm.moving=false;return}
  if(pm.d%2===0)pm.y=cy;else pm.x=cx}
 pm.moving=true;pm.x+=DIRS[pm.d][0]*sp;pm.y+=DIRS[pm.d][1]*sp;if(pm.x<-.5)pm.x+=C;if(pm.x>C-.5)pm.x-=C;pm.mouth+=.25;
 const cx=Math.round(pm.x),cy=Math.round(pm.y),c=cell(cx,cy);
 if(c==='.'||c==='o'){grid[cy][cx]=' ';eatenDots++;score+=c==='o'?50:10;tone(eatenDots%2?520:620,.04,'triangle',.03);
  if(c==='o'){fright=Math.max(120,420-level*40);chain=0;ghosts.forEach(g=>{if(g.st==='active'){g.fr=true;g.d=(g.d+2)%4}});tone(200,.3,'sawtooth',.04,600)}
  if(eatenDots===70||eatenDots===150)fruit={x:9,y:11,t:560,v:100*level};hud();
  if(eatenDots===dots){st='clear';tone(784,.3,'triangle',.06);setTimeout(()=>{level++;loadLevel();st='play';hud()},1400)}}
 if(fruit&&Math.abs(pm.x-fruit.x)<.6&&Math.abs(pm.y-fruit.y)<.6){score+=fruit.v;pops.push({x:fruit.x,y:fruit.y,v:fruit.v,l:60});fruit=null;tone(1000,.2,'sine',.05,1500);hud()}}
function target(g){if(g.st==='eyes')return[9,7];if(mode==='scatter')return g.sc;const px=Math.round(pm.x),py=Math.round(pm.y),[dx,dy]=DIRS[pm.d];
 if(g.id===0)return[px,py];if(g.id===1)return[px+dx*4,py+dy*4];if(g.id===2){const b=ghosts[0];return[px+dx*2+(px+dx*2-b.x),py+dy*2+(py+dy*2-b.y)]}return Math.hypot(g.x-px,g.y-py)>8?[px,py]:g.sc}
function moveGhost(g){const sp=speedG(g);
 if(g.st==='house'){g.y=9+Math.sin(t*.1+g.id)*.25;if(t>=g.rel&&readyT<=0){g.st='leave';g.y=9}return}
 if(g.st==='leave'){if(Math.abs(g.x-9)>.05){g.x+=Math.sign(9-g.x)*Math.min(.06,Math.abs(9-g.x))}else{g.x=9;g.y-=.06;if(g.y<=7){g.y=7;g.st='active';g.d=2;if(fright>0)g.fr=true}}return}
 if(g.st==='eyes'&&Math.abs(g.x-9)<.2&&Math.abs(g.y-7)<.2){g.x=9;g.y=7;g.st='enter';return}
 if(g.st==='enter'){g.y+=.1;if(g.y>=9){g.y=9;g.st='leave';g.fr=false}return}
 if(atCenter(g,sp)){const cx=Math.round(g.x),cy=Math.round(g.y);g.x=cx;g.y=cy;const opts=[0,1,2,3].filter(d=>d!==(g.d+2)%4&&open(cx+DIRS[d][0],cy+DIRS[d][1],g)&&!(cell(cx+DIRS[d][0],cy+DIRS[d][1])==='-'&&g.st!=='eyes'));
  if(opts.length){if(g.fr)g.d=opts[Math.random()*opts.length|0];else{const[tx,ty]=target(g);g.d=opts.sort((a,b)=>Math.hypot(cx+DIRS[a][0]-tx,cy+DIRS[a][1]-ty)-Math.hypot(cx+DIRS[b][0]-tx,cy+DIRS[b][1]-ty))[0]}}else g.d=(g.d+2)%4}
 g.x+=DIRS[g.d][0]*sp;g.y+=DIRS[g.d][1]*sp;if(g.x<-.5)g.x+=C;if(g.x>C-.5)g.x-=C}
function update(){t++;if(st!=='play')return;if(readyT>0){readyT--;return}
 modeT++;const sched=mode==='scatter'?(level<3?420:300):1200;if(fright<=0&&modeT>sched){mode=mode==='scatter'?'chase':'scatter';modeT=0;ghosts.forEach(g=>{if(g.st==='active')g.d=(g.d+2)%4})}
 if(fright>0){fright--;if(fright===0)ghosts.forEach(g=>g.fr=false)}
 if(fruit&&--fruit.t<=0)fruit=null;
 movePac();ghosts.forEach(moveGhost);
 for(const g of ghosts){if(g.st!=='active')continue;if(Math.abs(g.x-pm.x)<.6&&Math.abs(g.y-pm.y)<.6){
  if(g.fr){g.fr=false;g.st='eyes';chain++;const v=200*Math.pow(2,chain-1);score+=v;pops.push({x:g.x,y:g.y,v,l:60});tone(900,.25,'square',.04,200);hud()}
  else{die();return}}}}
function die(){st='dying';lives--;hud();tone(600,1,'sawtooth',.05,60);for(let i=0;i<24;i++){const a=Math.random()*6.28;parts.push({x:pm.x,y:pm.y,vx:Math.cos(a)*.08,vy:Math.sin(a)*.08,l:1,c:['#ff7bd5','#ffd166','#5ce1e6','#fff'][i%4]})}
 setTimeout(()=>{if(lives<=0){st='over';document.getElementById('t').innerHTML=score>=best&&score>0?'NEW<br>RECORD':'GAME<br>OVER';document.getElementById('m').innerHTML=`Score ${score} · Level ${level}<br>Best ${best}`;document.getElementById('go').textContent='AGAIN';document.getElementById('ov').classList.add('on')}else{reset();st='play'}},1400)}
function wallPass(inset,col){x.fillStyle=col;const i=inset*T;for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(MAP[r][c]!=='#')continue;const X=OX+c*T,Y=OY+r*T;x.beginPath();x.roundRect(X+i,Y+i,T-2*i,T-2*i,T*.25);x.fill();
 if(c<C-1&&MAP[r][c+1]==='#')x.fillRect(X+T/2,Y+i,T,T-2*i);if(r<R-1&&MAP[r+1][c]==='#')x.fillRect(X+i,Y+T/2,T-2*i,T);
 if(c<C-1&&r<R-1&&MAP[r][c+1]==='#'&&MAP[r+1][c]==='#'&&MAP[r+1][c+1]==='#')x.fillRect(X+T/2,Y+T/2,T,T)}}
function jelly(g){const X=OX+(g.x+.5)*T,Y=OY+(g.y+.5)*T,s=T*.46;const fr=g.fr&&g.st==='active';
 if(g.st!=='eyes'){const col=fr?(fright<90&&t%20<10?'#fff':'#4d5bff'):g.col;x.fillStyle=col;x.beginPath();x.moveTo(X-s,Y+s);x.lineTo(X-s,Y-s*.2);x.quadraticCurveTo(X-s,Y-s*1.1,X,Y-s*1.1);x.quadraticCurveTo(X+s,Y-s*1.1,X+s,Y-s*.2);x.lineTo(X+s,Y+s);for(let k=0;k<4;k++){const wx=X+s-(k+.5)*s/2;x.quadraticCurveTo(wx+s*.12,Y+s*(k%2?.7:1.2)+Math.sin(t*.3+k)*s*.1,X+s-(k+1)*s/2,Y+s)}x.fill();
  x.fillStyle='#ffffff55';x.beginPath();x.ellipse(X-s*.45,Y-s*.5,s*.18,s*.28,-.4,0,7);x.fill()}
 if(fr){x.fillStyle='#ffe3f5';x.fillRect(X-s*.4,Y-s*.2,s*.2,s*.2);x.fillRect(X+s*.2,Y-s*.2,s*.2,s*.2);return}
 const[dx,dy]=DIRS[g.d];x.fillStyle='#fff';x.beginPath();x.ellipse(X-s*.38,Y-s*.2,s*.26,s*.32,0,0,7);x.ellipse(X+s*.38,Y-s*.2,s*.26,s*.32,0,0,7);x.fill();x.fillStyle='#231040';x.beginPath();x.arc(X-s*.38+dx*s*.12,Y-s*.2+dy*s*.14,s*.13,0,7);x.arc(X+s*.38+dx*s*.12,Y-s*.2+dy*s*.14,s*.13,0,7);x.fill()}
function donut(){const X=OX+(pm.x+.5)*T,Y=OY+(pm.y+.5)*T,r=T*.46;const m=st==='dying'?Math.PI*(.2+Math.min(1,(t%1000)/80)):Math.abs(Math.sin(pm.mouth))*.7+.05;const a=[0,Math.PI/2,Math.PI,-Math.PI/2][pm.d];
 x.save();x.translate(X,Y);x.rotate(a);x.fillStyle='#d99a55';x.beginPath();x.moveTo(0,0);x.arc(0,0,r,m/2,Math.PI*2-m/2);x.closePath();x.fill();x.fillStyle='#ff7bd5';x.beginPath();x.moveTo(0,0);x.arc(0,0,r*.84,m/2+.1,Math.PI*2-m/2-.1);x.closePath();x.fill();
 x.fillStyle='#1c0a2b';x.beginPath();x.arc(-r*.1,0,r*.28,0,7);x.fill();['#fff','#5ce1e6','#ffd166','#fff'].forEach((c,i)=>{x.fillStyle=c;const aa=1.2+i*1.1;x.fillRect(Math.cos(aa)*r*.58-2,Math.sin(aa)*r*.58-1,4,2)});x.restore()}
function draw(){x.fillStyle='#1c0a2b';x.fillRect(0,0,W,H);if(!grid)return;
 wallPass(.12,'#ff7bd5');wallPass(.24,'#2e1244');
 x.fillStyle='#ffa6e0';x.fillRect(OX+9*T+T*.1,OY+8*T+T*.42,T*.8,T*.16);
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const ch=grid[r][c],X=OX+(c+.5)*T,Y=OY+(r+.5)*T;if(ch==='.'){x.fillStyle=['#ffd166','#5ce1e6','#fff','#ff7bd5'][(r*7+c)%4];x.save();x.translate(X,Y);x.rotate((r*3+c)%4);x.fillRect(-T*.12,-T*.045,T*.24,T*.09);x.restore()}
  if(ch==='o'&&t%30<22){x.fillStyle='#fff';x.shadowColor='#ff7bd5';x.shadowBlur=12;x.beginPath();x.arc(X,Y,T*.28,0,7);x.fill();x.shadowBlur=0}}
 if(fruit){const X=OX+(fruit.x+.5)*T,Y=OY+(fruit.y+.5)*T;x.fillStyle='#ff3b5c';x.beginPath();x.arc(X-T*.14,Y+T*.1,T*.2,0,7);x.arc(X+T*.16,Y+T*.14,T*.2,0,7);x.fill();x.strokeStyle='#3fae5a';x.lineWidth=2;x.beginPath();x.moveTo(X-T*.14,Y);x.quadraticCurveTo(X,Y-T*.4,X+T*.2,Y-T*.35);x.moveTo(X+T*.16,Y+T*.04);x.lineTo(X+T*.2,Y-T*.35);x.stroke()}
 if(st!=='dying'||t%8<6)donut();
 if(st!=='dying')ghosts.forEach(jelly);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.02;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.fillRect(OX+(p.x+.5)*T,OY+(p.y+.5)*T,4,4)});x.globalAlpha=1;parts=parts.filter(p=>p.l>0);
 pops.forEach(p=>{p.l--;x.fillStyle='#fff';x.font=`800 ${T*.55}px Sniglet`;x.textAlign='center';x.fillText(p.v,OX+(p.x+.5)*T,OY+(p.y+.5)*T-(60-p.l)*.3)});pops=pops.filter(p=>p.l>0);
 if(st==='play'&&readyT>0){x.fillStyle='#ffd166';x.font=`800 ${T*.9}px Sniglet`;x.textAlign='center';x.fillText('READY!',OX+9.5*T,OY+11.8*T)}
 if(st==='clear'&&t%20<10){wallPass(.12,'#fff')}}
function loop(){update();draw();requestAnimationFrame(loop)}
loadLevel();requestAnimationFrame(loop);
const KM={ArrowRight:0,d:0,D:0,ArrowDown:1,s:1,S:1,ArrowLeft:2,a:2,A:2,ArrowUp:3,w:3,W:3};
addEventListener('keydown',e=>{if(e.key in KM){e.preventDefault();want=KM[e.key]}if((e.key===' '||e.key==='Enter')&&document.getElementById('ov').classList.contains('on')){e.preventDefault();start()}});
let t0=null;addEventListener('touchstart',e=>{t0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
addEventListener('touchmove',e=>{if(!t0)return;const dx=e.touches[0].clientX-t0[0],dy=e.touches[0].clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20){want=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);t0=[e.touches[0].clientX,e.touches[0].clientY]}},{passive:true});
document.getElementById('go').onclick=start;
</script>
</body>
</html>
