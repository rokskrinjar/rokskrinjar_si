<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snap Reflex</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none}
body{font-family:'Inter Tight',sans-serif;background:#111;color:#fff;transition:background .08s;cursor:pointer}
body.wait{background:#d7263d}body.go{background:#1bd96a;color:#0b2b16}body.soon{background:#ff9f1c;color:#2b1600}body.res{background:#1d3bff}body.done{background:#f4f1ea;color:#111}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.tag{font-weight:800;letter-spacing:.3em;font-size:13px;text-transform:uppercase;opacity:.85}
.big{font-family:Anton,sans-serif;font-size:clamp(70px,24vw,220px);line-height:.88;letter-spacing:-.01em;text-transform:uppercase;margin:10px 0}
.sub{font-size:clamp(15px,4vw,20px);font-weight:500;max-width:520px;line-height:1.45}
.dots{display:flex;gap:8px;margin-top:22px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;opacity:.6}.dots i.f{background:currentColor;opacity:1}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:22px;max-width:520px}.bars div{flex:1;background:#111;position:relative;min-height:4px}.bars div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-weight:800;font-size:12px}
.scale{display:flex;margin-top:28px;max-width:520px;font-size:11px;font-weight:800;letter-spacing:.08em}.scale div{flex:1;padding:6px 4px;border-top:4px solid #111;opacity:.4}.scale div.on{opacity:1;border-color:#1d3bff;color:#1d3bff}
.corner{position:fixed;right:18px;top:14px;font-weight:800;font-size:13px;letter-spacing:.1em;text-align:right}
.back{position:fixed;left:14px;top:14px;color:inherit;text-decoration:none;font-size:13px;font-weight:800;z-index:6;opacity:.8}
</style>
<style>html.embed .back,html.embed a.bk{display:none!important}</style><script>try{if(window.self!==window.parent)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}</script>
</head>
<body>
<a class="back" href="index.html" onclick="event.stopPropagation()">← games</a>
<div class="corner" id="corner">BEST —</div>
<div class="wrap"><div class="tag" id="tag">Reaction test · 5 rounds</div><div class="big" id="big">Snap<br>Reflex</div><div class="sub" id="sub">When the screen turns green, tap — or hit any key — as fast as you can. Jump the gun and the round restarts.</div><div class="dots" id="dots"></div><div id="extra"></div></div>
<script>
const K='best-snap-reflex';const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st='idle',times=[],timer=null,goAt=0,best=ls.g(K,0);const $=id=>document.getElementById(id);
const RANKS=[[180,'CHEETAH'],[220,'FALCON'],[260,'FOX'],[310,'CAT'],[380,'HUMAN'],[1e9,'SLOTH']];
let AC;function tone(f,d=.08,type='square',v=.05){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function corner(){$('corner').textContent='BEST '+(best?best+' MS':'—')}corner();
function dots(){$('dots').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<times.length?'f':''}"></i>`).join('')}
function set(cls,tag,big,sub){document.body.className=cls;$('tag').textContent=tag;$('big').innerHTML=big;$('sub').innerHTML=sub;$('extra').innerHTML='';dots()}
function arm(){st='wait';set('wait',`Round ${times.length+1} of 5`,'Wait…','for green');clearTimeout(timer);timer=setTimeout(()=>{st='go';goAt=performance.now();set('go',`Round ${times.length+1} of 5`,'Tap!','now now now');tone(880,.06)},1200+Math.random()*2800)}
function rank(ms){return RANKS.find(r=>ms<r[0])[1]}
function act(){if(st==='idle'||st==='done'){times=[];arm();return}
 if(st==='wait'){clearTimeout(timer);st='soon';tone(160,.2,'sawtooth',.05);set('soon','Too soon','Easy<br>there','Wait for green. Tap to retry this round.');return}
 if(st==='soon'){arm();return}
 if(st==='go'){const ms=Math.round(performance.now()-goAt);times.push(ms);tone(ms<250?1320:660,.1,'triangle',.05);
  if(times.length<5){st='res';set('res',`Round ${times.length} of 5`,ms+'<small style="font-size:.35em"> ms</small>',rank(ms).toLowerCase()+' speed · tap for the next round')}else finish();return}
 if(st==='res'){arm()}}
function finish(){st='done';const avg=Math.round(times.reduce((a,b)=>a+b)/times.length);const rec=!best||avg<best;if(rec){best=avg;ls.s(K,best);corner()}const r=rank(avg);
 set('done',rec?'New personal best':'Average of 5',avg+'<small style="font-size:.35em"> ms</small>',`You react like a <b>${r.toLowerCase()}</b>. Fastest ${Math.min(...times)} ms · slowest ${Math.max(...times)} ms.<br>Tap to go again.`);
 const mx=Math.max(...times,400);$('extra').innerHTML=`<div class="bars">${times.map(t=>`<div style="height:${t/mx*100}%"><span>${t}</span></div>`).join('')}</div><div class="scale">${RANKS.map(([ms,n])=>`<div class="${n===r?'on':''}">${n}<br>${ms<1e8?'<'+ms:'380+'}</div>`).join('')}</div>`;
 [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.05),i*90))}
addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;act()});
addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.key==='Tab')return;e.preventDefault();act()});
</script>
</body>
</html>
