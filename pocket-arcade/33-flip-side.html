<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flip Side</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none}
body{background:#f2ede4;font-family:Unbounded,sans-serif;color:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 10px 12px;background-image:radial-gradient(circle at 0 0,#ff5a36 0 90px,transparent 91px),radial-gradient(circle at 100% 100%,#2346ff 0 120px,transparent 121px)}
h1{font-weight:800;font-size:clamp(30px,8vw,46px);letter-spacing:-.04em;line-height:1}h1 span{display:inline-block;transform:scaleX(-1);color:#ff5a36}
.sc{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px}.pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border:3px solid #141414;border-radius:40px;background:#fff}.pill.turn{background:#ffd23f}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #141414}.dot.b{background:#141414}.dot.w{background:#fff}
.board{display:grid;grid-template-columns:repeat(8,var(--s));border:4px solid #141414;background:#141414;gap:3px;--s:min(10.5vw,calc((100vh - 250px)/8.4),60px);box-shadow:10px 10px 0 #2346ff}
.sq{width:var(--s);height:var(--s);background:#e7dfd0;position:relative;cursor:pointer;perspective:300px}.sq:nth-child(16n+2),.sq:nth-child(16n+4),.sq:nth-child(16n+6),.sq:nth-child(16n+8),.sq:nth-child(16n+9),.sq:nth-child(16n+11),.sq:nth-child(16n+13),.sq:nth-child(16n+15){background:#ddd3c1}
.sq.can::after{content:'';position:absolute;inset:38%;border-radius:50%;background:#2346ff66}
.sq.kb{outline:3px solid #ff5a36;outline-offset:-3px}
.disc{position:absolute;inset:10%;transform-style:preserve-3d;transition:transform .45s}.disc i{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;border:3px solid #141414}.disc i.b{background:#141414}.disc i.w{background:#fff;transform:rotateY(180deg)}
.disc.W{transform:rotateY(180deg)}.disc.pop{animation:pp .25s}@keyframes pp{from{transform:scale(0)}}
.disc.last i{box-shadow:0 0 0 3px #ff5a36}
.msg{font-weight:500;font-size:13px;min-height:18px;text-align:center}
.bar{display:flex;gap:6px}.bar button{font:inherit;font-weight:800;font-size:11px;border:3px solid #141414;background:#fff;padding:6px 12px;border-radius:40px;cursor:pointer}.bar button.on{background:#141414;color:#fff}
.back{position:fixed;left:12px;top:12px;color:#141414;text-decoration:none;font-size:12px;font-weight:800;z-index:6}
</style>
<style>html.embed .back,html.embed a.bk{display:none!important}</style><script>try{if(window.self!==window.parent)document.documentElement.classList.add("embed")}catch(e){document.documentElement.classList.add("embed")}</script>
</head>
<body>
<a class="back" href="index.html">← games</a>
<h1>Flip <span>Side</span></h1>
<div class="sc"><div class="pill" id="pb"><span class="dot b"></span>You <b id="nb">2</b></div><div class="pill" id="pw"><span class="dot w"></span>CPU <b id="nw">2</b></div></div>
<div class="board" id="board"></div>
<div class="msg" id="msg">You play black. Tap a blue dot — or arrows + Space.</div>
<div class="bar" id="lvl"><button data-d="1">Easy</button><button data-d="3" class="on">Normal</button><button data-d="5">Hard</button><button id="new">New</button></div>
<script>
const K='best-flip-side';const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const B=1,Wt=2,boardEl=document.getElementById('board');let g,sqs=[],turn,depth=3,cur=19,busy=false,best=ls.g(K,0),last=-1;
const WGT=[100,-20,10,5,5,10,-20,100,-20,-50,-2,-2,-2,-2,-50,-20,10,-2,1,1,1,1,-2,10,5,-2,1,0,0,1,-2,5,5,-2,1,0,0,1,-2,5,10,-2,1,1,1,1,-2,10,-20,-50,-2,-2,-2,-2,-50,-20,100,-20,10,5,5,10,-20,100];
let AC;function tone(f,d=.08,type='triangle',v=.05){try{AC=AC||new AudioContext();const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.frequency.value=f;gg.gain.setValueAtTime(v,AC.currentTime);gg.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gg).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
for(let i=0;i<64;i++){const d=document.createElement('div');d.className='sq';d.onclick=()=>{cur=i;human(i)};boardEl.appendChild(d);sqs.push(d)}
const DIRS=[-9,-8,-7,-1,1,7,8,9];
function flips(b,i,p){if(b[i])return[];const o=3-p,out=[];for(const d of DIRS){const line=[];let j=i;while(true){const c=j%8;j+=d;if(j<0||j>=64)break;const nc=j%8;if(Math.abs(nc-c)>1)break;if(b[j]===o)line.push(j);else{if(b[j]===p&&line.length)out.push(...line);break}}}return out}
function moves(b,p){const m=[];for(let i=0;i<64;i++)if(!b[i]&&flips(b,i,p).length)m.push(i);return m}
function newGame(){g=Array(64).fill(0);g[27]=g[36]=Wt;g[28]=g[35]=B;turn=B;busy=false;last=-1;sqs.forEach(s=>s.innerHTML='');render(true);msg('You play black. Tap a blue dot — or arrows + Space.')}
function render(fresh){const mv=turn===B&&!busy?moves(g,B):[];sqs.forEach((s,i)=>{s.classList.toggle('can',mv.includes(i));s.classList.toggle('kb',i===cur);let d=s.firstChild;if(g[i]){if(!d){d=document.createElement('div');d.className='disc pop';d.innerHTML='<i class="b"></i><i class="w"></i>';s.appendChild(d);if(g[i]===Wt)d.classList.add('W')}else d.classList.toggle('W',g[i]===Wt);d.classList.toggle('last',i===last)}else if(d)d.remove()});
 const nb=g.filter(v=>v===B).length,nw=g.filter(v=>v===Wt).length;document.getElementById('nb').textContent=nb;document.getElementById('nw').textContent=nw;document.getElementById('pb').classList.toggle('turn',turn===B);document.getElementById('pw').classList.toggle('turn',turn===Wt)}
function msg(s){document.getElementById('msg').textContent=s}
function place(i,p){const f=flips(g,i,p);if(!f.length)return false;g[i]=p;last=i;render();f.forEach((j,k)=>setTimeout(()=>{g[j]=p;render();tone(400+k*40,.05)},80+k*60));return 80+f.length*60+200}
function human(i){if(busy||turn!==B)return;const t=place(i,B);if(!t){tone(150,.08,'square',.03);return}busy=true;setTimeout(()=>{busy=false;next(Wt)},t)}
function next(p){const mb=moves(g,B),mw=moves(g,Wt);if(!mb.length&&!mw.length){finish();return}
 if(p===Wt){if(!mw.length){turn=B;msg('CPU has no move — your turn again.');render();return}turn=Wt;render();msg('CPU is thinking…');busy=true;setTimeout(ai,350)}
 else{if(!mb.length){msg('No legal move for you — CPU plays again.');turn=Wt;setTimeout(()=>next(Wt),700);return}turn=B;msg('Your move.');render()}}
function evalB(b,p){let s=0;for(let i=0;i<64;i++){if(b[i]===p)s+=WGT[i];else if(b[i]===3-p)s-=WGT[i]}s+=(moves(b,p).length-moves(b,3-p).length)*4;return s}
function search(b,d,a,be,p){const m=moves(b,p);if(d===0)return evalB(b,p);if(!m.length){if(!moves(b,3-p).length){const diff=b.filter(v=>v===p).length-b.filter(v=>v===3-p).length;return diff*1000}return -search(b,d-1,-be,-a,3-p)}
 let best=-Infinity;for(const i of m){const nb=b.slice(),f=flips(nb,i,p);nb[i]=p;f.forEach(j=>nb[j]=p);const v=-search(nb,d-1,-be,-a,3-p);if(v>best)best=v;if(v>a)a=v;if(a>=be)break}return best}
function ai(){const m=moves(g,Wt);let bi=m[0],bv=-Infinity;for(const i of m){const nb=g.slice(),f=flips(nb,i,Wt);nb[i]=Wt;f.forEach(j=>nb[j]=Wt);let v=-search(nb,depth-1,-Infinity,Infinity,B);if(depth===1)v+=Math.random()*30;if(v>bv){bv=v;bi=i}}
 const t=place(bi,Wt);setTimeout(()=>{busy=false;next(B)},t)}
function finish(){const nb=g.filter(v=>v===B).length,nw=g.filter(v=>v===Wt).length;turn=0;render();
 if(nb>nw){const m=nb-nw;msg(`You win ${nb}–${nw}! `+(m>best?'New best margin!':'')+' (N for new game)');if(m>best){best=m;ls.s(K,best)}[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*100))}
 else if(nw>nb){msg(`CPU wins ${nw}–${nb}. Flip it back? (N)`);tone(140,.4,'sawtooth',.05)}else msg(`Draw ${nb}–${nw}. (N)`)}
addEventListener('keydown',e=>{const k=e.key;let r=cur>>3,c=cur%8;if(k==='ArrowLeft'||k==='a')c=Math.max(0,c-1);else if(k==='ArrowRight'||k==='d')c=Math.min(7,c+1);else if(k==='ArrowUp'||k==='w')r=Math.max(0,r-1);else if(k==='ArrowDown'||k==='s')r=Math.min(7,r+1);else if(k===' '||k==='Enter'){e.preventDefault();human(cur);return}else if(k==='n'||k==='N'){newGame();return}else return;e.preventDefault();cur=r*8+c;render()});
document.getElementById('lvl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='new'){newGame();return}depth=+b.dataset.d;document.querySelectorAll('#lvl button[data-d]').forEach(x=>x.classList.toggle('on',x===b));newGame()};
newGame();
</script>
</body>
</html>
