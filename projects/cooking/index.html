<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja kuharska knjiga · Rok Skrinjar</title>
  <meta name="description" content="Osebna zbirka preverjenih receptov in kuharskih spoznanj.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/projects/cooking/cookbook.css">
  <script src="/projects/cooking/gate.js"></script>
</head>
<body>
  <main id="app">
    <p class="state">Nalagam kuharsko knjigo…</p>
    <noscript><p class="state">Kuharska knjiga za prikaz potrebuje JavaScript.</p></noscript>
  </main>
  <script>
    // Recipes and knowledge live as Markdown files in the repo (the single source of truth):
    //   projects/cooking/recipes/<slug>.md, projects/cooking/knowledge/<slug>.md
    // Adding a file is enough; the list comes from the GitHub API. Format: projects/cooking/README.md
    const REPO = 'rokskrinjar/rokskrinjar_si', BRANCH = 'main', BASE = 'projects/cooking';
    const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname); // local preview server
    const app = document.getElementById('app');
    const SLUG = /^[a-z0-9][a-z0-9-]*$/;
    const STATUS = {
      'preizkuseno': { label: 'Preizkušeno', ok: true },
      'predlog': { label: 'Še ni preizkušeno', ok: false },
      'v-razvoju': { label: 'V razvoju', ok: false },
    };

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const md = s => DOMPurify.sanitize(marked.parse(s || ''));
    const fmtDate = d => {
      const t = new Date(String(d) + 'T12:00:00');
      return isNaN(t) ? esc(d) : t.toLocaleDateString('sl-SI', { day: 'numeric', month: 'long', year: 'numeric' });
    };
    const list = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);

    function parse(text, slug) {
      const m = text.match(/^﻿?---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      let meta = {};
      if (m) { try { meta = jsyaml.load(m[1], { schema: jsyaml.CORE_SCHEMA }) || {}; } catch (e) { meta = {}; } }
      return { ...meta, slug, title: meta.title || slug, date: meta.date ? String(meta.date) : '', body: m ? m[2] : text };
    }

    async function listDir(dir) {
      const key = 'cookbook:' + dir;
      try { const c = JSON.parse(sessionStorage.getItem(key)); if (c && Date.now() - c.t < 5 * 60e3) return c.v; } catch (e) {}
      const url = LOCAL ? `/__ls/${BASE}/${dir}` : `https://api.github.com/repos/${REPO}/contents/${BASE}/${dir}?ref=${BRANCH}`;
      const r = await fetch(url);
      if (r.status === 404) return [];
      if (!r.ok) throw new Error('list ' + r.status);
      const v = (await r.json())
        .filter(f => f.type === 'file' && /\.md$/i.test(f.name) && !/^[_.]/.test(f.name))
        .map(f => f.name.replace(/\.md$/i, ''))
        .filter(s => SLUG.test(s));
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch (e) {}
      return v;
    }

    async function load(dir, slug) {
      if (!SLUG.test(slug)) return null;
      let r = await fetch(`${dir}/${slug}.md`, { cache: 'no-cache' }).catch(() => null);
      // Just merged and GitHub Pages hasn't redeployed yet: read it straight from the repo.
      if ((!r || !r.ok) && !LOCAL) r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${BASE}/${dir}/${slug}.md`).catch(() => null);
      if (!r || !r.ok) return null;
      return parse(await r.text(), slug);
    }
    const loadAll = async (dir, slugs) => (await Promise.all(slugs.map(s => load(dir, s)))).filter(Boolean);

    const photoSrc = p => {
      const src = typeof p === 'string' ? p : p && p.src;
      return src && /^(https:\/\/|[\w-][\w\-./]*$)/.test(src) && !src.includes('..') ? src : null;
    };
    const photoAlt = (p, title) => (p && typeof p === 'object' && p.alt) || title;
    const statusBadge = s => {
      const st = STATUS[s];
      return st ? `<span class="badge${st.ok ? ' ok' : ''}">${st.ok ? '✓ ' : ''}${esc(st.label)}</span>` : '';
    };
    const stars = n => {
      n = Number(n);
      if (!(n >= 1 && n <= 5)) return '';
      n = Math.round(n);
      return `<span class="stars" aria-label="Ocena ${n} od 5">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
    };
    const excerpt = body => {
      const div = document.createElement('div');
      div.innerHTML = md(body);
      let t = '';
      for (const el of div.querySelectorAll('p, li')) { t += (t ? ' ' : '') + el.textContent.trim(); if (t.length >= 120) break; }
      t = t || div.textContent.trim();
      return t.length > 160 ? t.slice(0, 157).trimEnd() + '…' : t;
    };
    const footer = `<footer>Osebna zbirka preverjenih receptov in kuharskih spoznanj · <a href="/projects/">Rok Skrinjar</a></footer>`;

    async function renderHome() {
      const [rSlugs, kSlugs] = await Promise.all([listDir('recipes'), listDir('knowledge')]);
      const [recipes, topics] = await Promise.all([loadAll('recipes', rSlugs), loadAll('knowledge', kSlugs)]);
      const ord = r => Number.isFinite(Number(r.order)) && r.order !== null && r.order !== '' ? Number(r.order) : 999;
      recipes.sort((a, b) => b.date.localeCompare(a.date) || ord(a) - ord(b) || a.title.localeCompare(b.title, 'sl'));
      topics.sort((a, b) => a.title.localeCompare(b.title, 'sl'));
      const cats = [...new Set(recipes.map(r => r.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sl'));

      const card = r => {
        const photo = list(r.photos).map(photoSrc).find(Boolean);
        return `<a class="card" href="?r=${esc(r.slug)}" data-cat="${esc(r.category || '')}">
          ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy">` : ''}
          <div class="card-body">
            <div class="meta">${r.category ? `<span>${esc(r.category)}</span>` : ''}${r.date ? `<span>${fmtDate(r.date)}</span>` : ''}</div>
            <h3>${esc(r.title)}</h3>
            ${r.verdict ? `<p class="verdict">»${esc(r.verdict)}«</p>` : ''}
            ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
            ${(r.time || r.difficulty) ? `<div class="meta">${r.time ? `<span>${esc(r.time)}</span>` : ''}${r.difficulty ? `<span>Zahtevnost: ${esc(r.difficulty)}</span>` : ''}</div>` : ''}
            <div class="badges">${statusBadge(r.status)}${stars(r.rating)}</div>
          </div>
        </a>`;
      };

      app.innerHTML = `
        <a class="back" href="/projects/">← Projekti</a>
        <p class="eyebrow">Kuharska knjiga</p>
        <h1>Moja kuharska knjiga</h1>
        <p class="lead">Osebna zbirka preverjenih receptov in kuharskih spoznanj: kaj se je obneslo, različice in mali kuharski triki.</p>
        <nav class="sections" aria-label="Razdelki">
          <a href="#recepti">Recepti · ${recipes.length}</a>
          <a href="#znanje">Kuharsko znanje · ${topics.length}</a>
          <a href="temperatures/">Temperature pečenja</a>
        </nav>
        <section id="recepti">
          <div class="section-head"><h2>Recepti</h2></div>
          ${cats.length ? `<div class="chips" role="group" aria-label="Kategorije">
            <button type="button" class="chip" data-cat="" aria-pressed="true">Vse</button>
            ${cats.map(c => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}
          </div>` : ''}
          ${recipes.length ? `<div class="grid" id="recipes">${recipes.map(card).join('')}</div>` : '<p class="muted">Še ni receptov.</p>'}
        </section>
        <section id="znanje">
          <div class="section-head"><h2>Kuharsko znanje</h2><span class="muted">Tehnike, razlage in triki</span></div>
          <a class="feature" href="temperatures/"><span class="feature-t">°C</span><span><h3>Temperature pečenja mesa in rib</h3><p>Izberi kos in pečenost ter takoj dobi ciljno temperaturo sredice, čas počivanja in uradni varnostni minimum.</p></span></a>
          ${topics.length ? `<ul class="topics">${topics.map(k => `<li><a href="?k=${esc(k.slug)}"><h3>${esc(k.title)}</h3><p>${esc(excerpt(k.body))}</p></a></li>`).join('')}</ul>` : '<p class="muted">Še ni zapisov.</p>'}
        </section>
        ${footer}`;

      app.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        app.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
        app.querySelectorAll('#recipes .card').forEach(c => { c.hidden = cat !== '' && c.dataset.cat !== cat; });
      }));
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    }

    function wrapTables(root) {
      root.querySelectorAll('table').forEach(t => {
        const box = document.createElement('div');
        box.className = 'table-wrap';
        t.replaceWith(box);
        box.append(t);
      });
    }

    // Turn the lists under "Sestavine" and "Priprava"/"Postopek" (including ### subsections) into tap-to-tick checklists.
    function checklists(root) {
      const tick = listEl => {
        const numbered = listEl.tagName === 'OL';
        listEl.classList.add('check');
        [...listEl.children].forEach((li, i) => {
          const label = document.createElement('label');
          const box = document.createElement('input');
          box.type = 'checkbox';
          const text = document.createElement('span');
          text.append(...li.childNodes);
          label.append(box);
          if (numbered) { const n = document.createElement('span'); n.className = 'n'; n.textContent = (i + 1) + '.'; label.append(n); }
          label.append(text);
          li.append(label);
        });
      };
      root.querySelectorAll('h2').forEach(h => {
        if (!/^(sestavine|priprava|postopek)$/i.test(h.textContent.trim())) return;
        for (let el = h.nextElementSibling; el && el.tagName !== 'H2'; el = el.nextElementSibling) {
          if (/^(UL|OL)$/.test(el.tagName)) tick(el);
        }
      });
    }

    function wakeLockButton() {
      if (!('wakeLock' in navigator)) return;
      const btn = document.getElementById('wake');
      btn.hidden = false;
      let lock = null, want = false;
      const acquire = async () => { try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) { want = false; } btn.setAttribute('aria-pressed', String(want && !!lock)); };
      btn.addEventListener('click', async () => {
        want = !want;
        if (want) await acquire(); else { await lock?.release(); btn.setAttribute('aria-pressed', 'false'); }
      });
      document.addEventListener('visibilitychange', () => { if (want && !lock && document.visibilityState === 'visible') acquire(); });
    }

    function notFound(what) {
      app.innerHTML = `<div class="narrow"><a class="back" href="./">← Kuharska knjiga</a><h1>Ni najdeno</h1><p class="lead">${esc(what)} ne obstaja ali je bil preimenovan.</p></div>`;
    }

    async function renderRecipe(slug) {
      const r = await load('recipes', slug);
      if (!r) return notFound('Recept');
      document.title = `${r.title} · Moja kuharska knjiga`;
      const topics = await loadAll('knowledge', list(r.knowledge).filter(s => SLUG.test(s)));
      const photos = list(r.photos).map(p => ({ src: photoSrc(p), alt: photoAlt(p, r.title) })).filter(p => p.src);
      const temps = await fetch('temperatures/data.json').then(x => x.json()).then(d => d.cuts.filter(c => (c.recipes || []).includes(slug)).map(c => {
        const o = c.doneness ? { temp: d.doneness[c.default].target, label: d.doneness[c.default].label } : (c.options.find(o => o.id === c.default) || c.options[0]);
        return { id: c.id, name: c.name, temp: o.temp, label: o.label };
      })).catch(() => []);
      app.innerHTML = `<article class="narrow">
        <a class="back" href="./">← Kuharska knjiga</a>
        ${r.category ? `<p class="eyebrow">${esc(r.category)}</p>` : '<p class="eyebrow">Recept</p>'}
        <h1>${esc(r.title)}</h1>
        ${r.description ? `<p class="lead">${esc(r.description)}</p>` : ''}
        <div class="detail-meta">
          ${r.date ? `<span>${fmtDate(r.date)}</span>` : ''}
          ${r.time ? `<span><b>Čas</b> ${esc(r.time)}</span>` : ''}
          ${r.servings ? `<span><b>Količina</b> ${esc(r.servings)}</span>` : ''}
          ${r.difficulty ? `<span><b>Zahtevnost</b> ${esc(r.difficulty)}</span>` : ''}
        </div>
        ${(r.status || r.verdict || r.rating) ? `<div class="verdict-big">
          <div class="badges">${statusBadge(r.status)}${stars(r.rating)}</div>
          ${r.verdict ? `<blockquote>»${esc(r.verdict)}«</blockquote>` : ''}
        </div>` : ''}
        ${photos.length ? `<div class="photos">${photos.map(p => `<img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy">`).join('')}</div>` : ''}
        ${temps.map(t => `<a class="temp-link" href="temperatures/?kos=${esc(t.id)}"><span class="temp-n">${t.temp} °C</span><span><b>Ciljna temperatura sredice</b>${esc(t.name)} · ${esc(t.label)}<small>Odpri vodnik po temperaturah →</small></span></a>`).join('')}
        <div class="tools"><button type="button" class="tool" id="wake" aria-pressed="false" hidden>Zaslon naj ostane prižgan</button></div>
        <div class="prose" id="body">${md(r.body)}</div>
        ${list(r.tags).length ? `<div class="badges">${list(r.tags).map(t => `<span class="badge tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${topics.length ? `<div class="related"><h2>Povezano kuharsko znanje</h2><ul>${topics.map(k => `<li><a href="?k=${esc(k.slug)}">${esc(k.title)}</a></li>`).join('')}</ul></div>` : ''}
        ${footer}
      </article>`;
      checklists(document.getElementById('body'));
      wrapTables(document.getElementById('body'));
      wakeLockButton();
    }

    async function renderTopic(slug) {
      const k = await load('knowledge', slug);
      if (!k) return notFound('Zapis');
      document.title = `${k.title} · Moja kuharska knjiga`;
      const recipes = await loadAll('recipes', list(k.recipes).filter(s => SLUG.test(s)));
      app.innerHTML = `<article class="narrow">
        <a class="back" href="./#znanje">← Kuharsko znanje</a>
        <p class="eyebrow">Kuharsko znanje</p>
        <h1>${esc(k.title)}</h1>
        ${k.date ? `<div class="detail-meta"><span>${fmtDate(k.date)}</span></div>` : ''}
        <div class="prose" id="body">${md(k.body)}</div>
        ${list(k.tags).length ? `<div class="badges">${list(k.tags).map(t => `<span class="badge tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${recipes.length ? `<div class="related"><h2>Uporabljeno v receptih</h2><ul>${recipes.map(r => `<li><a href="?r=${esc(r.slug)}">${esc(r.title)}</a></li>`).join('')}</ul></div>` : ''}
        ${footer}
      </article>`;
      wrapTables(document.getElementById('body'));
    }

    const start = () => {
      const q = new URLSearchParams(location.search);
      return (q.get('r') ? renderRecipe(q.get('r')) : q.get('k') ? renderTopic(q.get('k')) : renderHome());
    };

    cookbookGate(app).then(start)
      .catch(() => {
        app.innerHTML = `<a class="back" href="/projects/">← Projekti</a><h1>Moja kuharska knjiga</h1>
          <p class="lead">Vsebine trenutno ni mogoče naložiti. Poskusi znova čez minuto.</p>
          <p><a href="https://github.com/${REPO}/tree/${BRANCH}/${BASE}">Recepti na GitHubu</a></p>`;
      });
  </script>
</body>
</html>
