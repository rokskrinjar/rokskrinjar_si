<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toggle — Feature flags</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ln:#e6e6ef;--tx:#17172b;--mu:#6c6c85;--co:#2d4bff;--mg:#e2338b;--ok:#18a058}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'Rethink Sans',sans-serif}
.mono{font-family:'Martian Mono',monospace}
header{display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--ln)}
.lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px}.lg i{width:34px;height:20px;border-radius:999px;background:var(--co);position:relative}.lg i::after{content:'';position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.envs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:3px;margin-left:20px}.envs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font:600 13px 'Rethink Sans';cursor:pointer;color:var(--mu);display:flex;gap:6px;align-items:center}.envs button i{width:7px;height:7px;border-radius:50%}.envs button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
header .sp{flex:1}.srch{border:1px solid var(--ln);border-radius:9px;padding:7px 12px;width:240px;font:14px 'Rethink Sans'}
.lay{display:grid;grid-template-columns:1fr 440px;gap:20px;padding:22px 26px;max-width:1400px;margin:0 auto}
.list{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.lh{display:grid;grid-template-columns:1fr 120px 110px 60px;padding:12px 18px;font:500 11px 'Martian Mono';color:var(--mu);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--ln)}
.fl{display:grid;grid-template-columns:1fr 120px 110px 60px;padding:14px 18px;border-bottom:1px solid var(--ln);align-items:center;cursor:pointer}
.fl:hover{background:#fbfbfe}.fl.on{background:#f2f4ff;box-shadow:inset 3px 0 0 var(--co)}
.fl b{font-weight:600}.fl .k{font:12px 'Martian Mono';color:var(--mu);display:block}
.mini{display:flex;gap:2px}.mini i{width:6px;height:16px;border-radius:2px;background:#e3e4ee}.mini i.y{background:var(--co)}
.sw{width:42px;height:24px;border-radius:999px;background:#d5d6e3;position:relative;cursor:pointer;transition:.2s;border:0}.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.tg{font:11px 'Martian Mono';padding:2px 7px;border-radius:5px;background:#eef0ff;color:var(--co)}.tg.ex{background:#fde7f2;color:var(--mg)}.tg.ks{background:#fff1e6;color:#c2410c}
.det{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:22px;position:sticky;top:20px;align-self:start}
.det h2{margin:0;font-size:22px;letter-spacing:-.01em}.det .k{font:12px 'Martian Mono';color:var(--mu)}
h4{font:500 11px 'Martian Mono';text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 10px}
.pop{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin-bottom:10px}
.pop i{aspect-ratio:1;border-radius:50%;background:#e3e4ee;transition:background .25s,transform .25s}.pop i.y{background:var(--co);transform:scale(1.1)}.pop i.t{background:var(--mg)}
.rng{display:flex;align-items:center;gap:12px}.rng input{flex:1;accent-color:var(--co)}.rng b{font:500 22px 'Martian Mono';width:70px;text-align:right}
.rule{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13.5px}.rule .mono{font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px}
.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric div{border:1px solid var(--ln);border-radius:12px;padding:12px}.metric span{color:var(--mu);font-size:12px}.metric b{display:block;font:500 20px 'Martian Mono'}.up{color:var(--ok)}
.log{font:12px/1.8 'Martian Mono';color:var(--mu)}.log b{color:var(--tx);font-weight:500}
.kill{margin-top:18px;width:100%;border:1px solid #f3c1c1;background:#fff5f5;color:#c22;border-radius:10px;padding:10px;font:700 13px 'Rethink Sans';cursor:pointer}
@media(max-width:1000px){.lay{grid-template-columns:1fr}.det{position:static}.srch,.envs{display:none}.lh,.fl{grid-template-columns:1fr 60px}.lh span:nth-child(2),.lh span:nth-child(3),.fl>*:nth-child(2),.fl>*:nth-child(3){display:none}}
</style>
<script>if(window===window.top)document.head.appendChild(Object.assign(document.createElement("script"),{defer:true,src:"/_vercel/insights/script.js"}))</script>
</head>
<body>
<header><div class="lg"><i></i>toggle</div><div class="envs" id="env"><button><i style="background:#9ca3af"></i>Development</button><button><i style="background:#eab308"></i>Staging</button><button class="on"><i style="background:#18a058"></i>Production</button></div><span class="sp"></span><input class="srch" placeholder="Search 38 flags…  /"></header>
<div class="lay">
 <div class="list"><div class="lh"><span>Flag</span><span>Rollout</span><span>Type</span><span>On</span></div><div id="flags"></div></div>
 <aside class="det" id="det"></aside>
</div>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none">← 50 SaaS</a>
<script>
const F=[['New checkout flow','checkout-v2',25,'release',1,'+4.2% conversion'],['AI reply suggestions','ai-suggest',10,'experiment',1,'+11% replies sent'],['Dark mode','dark-mode',100,'release',1,'—'],['Bulk export to Parquet','export-parquet',50,'release',1,'0 errors'],['Search ranking v3','search-rank-v3',5,'experiment',1,'−2% latency'],['Legacy billing API','legacy-billing',100,'kill switch',1,'—'],['Onboarding checklist','onboard-check',0,'release',0,'—']];
let sel=0;const $=s=>document.getElementById(s);
function seg(p){let h='';for(let i=0;i<10;i++)h+=`<i class="${i<p/10?'y':''}"></i>`;return`<span class="mini">${h}</span>`}
function list(){$('flags').innerHTML=F.map((f,i)=>`<div class="fl ${i===sel?'on':''}" data-i="${i}"><div><b>${f[0]}</b><span class="k">${f[1]}</span></div><div>${seg(f[2])}</div><div><span class="tg ${f[3]==='experiment'?'ex':f[3]==='kill switch'?'ks':''}">${f[3]}</span></div><div><button class="sw ${f[4]?'on':''}" data-s="${i}"></button></div></div>`).join('')}
function det(){const f=F[sel];let dots='';for(let i=0;i<150;i++){const h=((i*2654435761)>>>0)%100;dots+=`<i class="${f[4]&&h<f[2]?(f[3]==='experiment'&&h<f[2]/2?'t':'y'):''}"></i>`}
 $('det').innerHTML=`<div class="k">${f[1]}</div><h2>${f[0]}</h2><h4>Who sees it · ${f[4]?f[2]:0}% of 148,210 users</h4><div class="pop" id="pop">${dots}</div>${f[3]==='experiment'?'<div style="font-size:12px;color:var(--mu);margin-bottom:8px"><span style="color:var(--mg)">●</span> variant B &nbsp; <span style="color:var(--co)">●</span> variant A</div>':''}
  <div class="rng"><input type="range" min="0" max="100" value="${f[2]}" id="rg"><b id="rv">${f[2]}%</b></div>
  <h4>Targeting rules</h4><div class="rule">Always on for <span class="mono">email ends with @fernway.example</span></div><div class="rule">If <span class="mono">plan = enterprise</span> and <span class="mono">region = EU</span> → serve <b>on</b></div><div class="rule">Everyone else → <b>${f[2]}%</b> rollout by <span class="mono">user.id</span></div>
  <h4>Impact since rollout</h4><div class="metric"><div><span>Primary metric</span><b class="up">${f[5]}</b></div><div><span>Error rate</span><b>0.12%</b></div></div>
  <h4>History</h4><div class="log"><b>Priya</b> raised rollout 10% → ${f[2]}% · 2h ago<br><b>CI</b> enabled in staging · yesterday<br><b>Tom</b> created flag · 12 Sep</div>
  <button class="kill" id="kill">⏻ Turn off everywhere</button>`;
 $('rg').oninput=e=>{f[2]=+e.target.value;$('rv').textContent=f[2]+'%';const ps=$('pop').children;for(let i=0;i<150;i++){const h=((i*2654435761)>>>0)%100;ps[i].className=f[4]&&h<f[2]?(f[3]==='experiment'&&h<f[2]/2?'t':'y'):''}list()};
 $('kill').onclick=()=>{f[4]=0;list();det()}}
$('flags').onclick=e=>{const s=e.target.closest('[data-s]');if(s){const f=F[+s.dataset.s];f[4]=f[4]?0:1;list();if(+s.dataset.s===sel)det();e.stopPropagation();return}const r=e.target.closest('.fl');if(r){sel=+r.dataset.i;list();det()}};
$('env').onclick=e=>{const b=e.target.closest('button');if(b)document.querySelectorAll('#env button').forEach(x=>x.classList.toggle('on',x===b))};
list();det();
</script>
</body>
</html>
