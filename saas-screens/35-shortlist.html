<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shortlist — Senior Product Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#f6f5f8;--card:#fff;--tx:#1e1b2e;--mu:#77738a;--ln:#e7e5ee;--acc:#3d3bb8;--accbg:#ecebfb;--g:#2a9d6f;--gbg:#e3f5ec;--r:#d9534f;--y:#e0a40e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Be Vietnam Pro',sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--ln)}
.lg{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}.lg i{width:24px;height:24px;border-radius:7px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.job{font-weight:600}.job span{color:var(--mu);font-weight:400}header .sp{flex:1}
.stages{display:flex;gap:6px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--ln);overflow-x:auto}
.st{display:flex;flex-direction:column;padding:10px 14px;border-radius:12px;min-width:130px;cursor:pointer;border:1px solid var(--ln);background:#fff}
.st b{font-size:22px;font-weight:700}.st span{color:var(--mu);font-size:12.5px}.st.on{background:var(--acc);color:#fff;border-color:var(--acc)}.st.on span{color:#cfcdf6}
.lay{display:grid;grid-template-columns:320px 1fr 340px;gap:16px;padding:16px 26px}
.list{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;align-self:start}
.c{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer}.c.on{background:var(--accbg)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.c div{flex:1;min-width:0}.c small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%}
.prof{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:24px}
.ph{display:flex;gap:16px;align-items:center}.ph .av{width:64px;height:64px;font-size:22px}.ph h1{margin:0;font-size:24px;letter-spacing:-.01em}.ph p{margin:2px 0 0;color:var(--mu)}
.links{display:flex;gap:8px;margin-left:auto}.links a{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:13px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--ln);margin:20px 0 16px}.tabs span{padding:8px 0;color:var(--mu);font-weight:600;cursor:pointer}.tabs span.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.tl{border-left:2px solid var(--ln);margin-left:8px;padding-left:20px}
.ev{position:relative;padding-bottom:18px}.ev::before{content:'';position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.ev small{color:var(--mu)}.ev .q{background:var(--bg);border-radius:12px;padding:12px;margin-top:6px}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.port div{height:90px;border-radius:12px}
.score{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;align-self:start;position:sticky;top:16px}
.score h3{margin:0 0 4px;font-size:16px}.score p{margin:0 0 14px;color:var(--mu);font-size:13px}
.crit{padding:10px 0;border-bottom:1px dashed var(--ln)}.crit .t{display:flex;justify-content:space-between;font-weight:600}
.pips{display:flex;gap:4px;margin-top:6px}.pips button{flex:1;height:28px;border-radius:7px;border:1px solid var(--ln);background:#fff;cursor:pointer;font:600 12px 'Be Vietnam Pro';color:var(--mu)}
.pips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.verdict{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.verdict button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:10px 4px;font:700 12px 'Be Vietnam Pro';cursor:pointer;text-align:center}
.verdict button.on.sy{background:var(--g);color:#fff;border-color:var(--g)}.verdict button.on.y{background:var(--gbg);color:var(--g);border-color:var(--g)}.verdict button.on.n{background:#fdecea;color:var(--r);border-color:var(--r)}.verdict button.on.sn{background:var(--r);color:#fff;border-color:var(--r)}
.panel{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}.panel span{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px}.panel span i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:700}
@media(max-width:1100px){.lay{grid-template-columns:1fr}.score{position:static}}
</style>
</head>
<body>
<header><div class="lg"><i>✓</i>Shortlist</div><span class="job">Senior Product Designer <span>· Lisbon or remote (EU) · opened 12 Sep</span></span><span class="sp"></span><span style="color:var(--mu)">Hiring manager: Inês Duarte</span></header>
<div class="stages" id="stages"></div>
<div class="lay"><div class="list" id="list"></div><div class="prof" id="prof"></div>
 <aside class="score"><h3>Your scorecard</h3><p>Portfolio review · rate against the brief, not against each other.</p><div id="crit"></div>
  <div class="verdict" id="vd"><button class="sn" data-v="sn">Strong no</button><button class="n" data-v="n">No</button><button class="y" data-v="y">Yes</button><button class="sy" data-v="sy">Strong yes</button></div>
  <div class="panel"><span><i style="background:#3d3bb8">ID</i>Inês · Yes</span><span><i style="background:#2a9d6f">JP</i>Joon · Strong yes</span><span><i style="background:#c06c84">MR</i>Marta · pending</span></div></aside></div>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none">← 50 SaaS</a>
<script>
const ST=[['Applied',148],['Screen',31],['Portfolio',12],['Onsite',5],['Offer',1]];let stg=2;
const C=[['Ama Lartey','Product Designer · Calder Labs','#d9825e',['g','g','g','y']],['Tomás Vidal','Senior Designer · Fernway','#3d6fb6',['g','y','y']],['Hye-jin Park','Design Lead · Orbis Retail','#2a9d6f',['g','g']],['Nikolai Berg','UX Designer · Velo Mobility','#8a63c7',['y','r']],['Leila Haddad','Product Designer · freelance','#c06c84',['g']],['Owen Price','Senior PD · Pellucid AI','#5b8c5a',[]]];
let sel=0;const R={};const $=s=>document.getElementById(s);
$('stages').innerHTML=ST.map((s,i)=>`<div class="st ${i===stg?'on':''}"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('');
function list(){$('list').innerHTML=C.map((c,i)=>`<div class="c ${i===sel?'on':''}" data-i="${i}"><span class="av" style="background:${c[2]}">${c[0].split(' ').map(x=>x[0]).join('')}</span><div><b>${c[0]}</b><small>${c[1]}</small></div><span class="dots">${c[3].map(d=>`<i style="background:${d==='g'?'var(--g)':d==='y'?'var(--y)':'var(--r)'}"></i>`).join('')}</span></div>`).join('')}
function prof(){const c=C[sel];$('prof').innerHTML=`<div class="ph"><span class="av" style="background:${c[2]}">${c[0].split(' ').map(x=>x[0]).join('')}</span><div><h1>${c[0]}</h1><p>${c[1]} · 7 yrs · Lisbon</p></div><div class="links"><a href="#">Portfolio ↗</a><a href="#">CV</a></div></div>
 <div class="tabs"><span class="on">Activity</span><span>Portfolio</span><span>Interview kit</span><span>Emails</span></div>
 <div class="tl"><div class="ev"><b>Portfolio shared</b> <small>· 2 days ago</small><div class="port"><div style="background:linear-gradient(135deg,#ffc9a8,#ff8fa3)"></div><div style="background:linear-gradient(135deg,#cfe3ff,#3d6fb6)"></div><div style="background:linear-gradient(135deg,#bfe3c8,#2a9d6f)"></div></div></div>
  <div class="ev"><b>Recruiter screen · passed</b> <small>· 25 Sep · Sara</small><div class="q">Strong on research-led redesigns (lab booking case study). Wants more systems work. Salary expectation within band. Notice: 1 month.</div></div>
  <div class="ev"><b>Applied via referral</b> <small>· 18 Sep · referred by Joon Park</small></div></div>`}
const K=['Problem framing','Craft & visual polish','Systems thinking','Collaboration evidence'];
function crit(){$('crit').innerHTML=K.map((k,i)=>`<div class="crit"><div class="t"><span>${k}</span><span style="color:var(--mu)">${R[sel+'-'+i]||'–'}/4</span></div><div class="pips">${[1,2,3,4].map(n=>`<button class="${R[sel+'-'+i]===n?'on':''}" data-k="${i}" data-n="${n}">${n}</button>`).join('')}</div></div>`).join('');
 document.querySelectorAll('#vd button').forEach(b=>b.classList.toggle('on',R[sel+'-v']===b.dataset.v))}
$('list').onclick=e=>{const c=e.target.closest('.c');if(c){sel=+c.dataset.i;list();prof();crit()}};
$('crit').onclick=e=>{const b=e.target.closest('[data-k]');if(b){R[sel+'-'+b.dataset.k]=+b.dataset.n;crit()}};
$('vd').onclick=e=>{const b=e.target.closest('[data-v]');if(b){R[sel+'-v']=b.dataset.v;crit()}};
R['0-0']=4;R['0-1']=3;list();prof();crit();
</script>
</body>
</html>
