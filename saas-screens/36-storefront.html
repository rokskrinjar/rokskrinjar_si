<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storefront — Ember & Oak admin</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#0d0d0d;--mu:#737373;--ln:#ebebeb;--fx:#d6246e;--fxbg:#fdeaf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Geist',sans-serif;display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.mono{font-family:'Geist Mono',monospace}
aside{border-right:1px solid var(--ln);padding:18px 12px;background:var(--card)}
.st{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}.st i{width:30px;height:30px;border-radius:8px;background:#3a2a1d;color:#f6efe4;display:grid;place-items:center;font-style:normal;font-weight:800}
.st b{display:block;font-size:14px}.st small{color:var(--mu)}
aside a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#333;text-decoration:none;font-weight:500}aside a.on{background:var(--tx);color:#fff}aside a span{font:12px 'Geist Mono';color:var(--mu)}aside a.on span{color:#bbb}
main{padding:26px 32px;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:15px;color:var(--mu);font-weight:500;margin:0}.rev{font:800 clamp(48px,7vw,92px)/.9 'Geist';letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums}
.rev small{font-size:.32em;letter-spacing:-.02em;color:var(--fx);font-weight:600;margin-left:10px}
.range{display:flex;gap:4px}.range button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 12px;font:500 13px 'Geist';cursor:pointer}.range button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chart{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px 18px 8px;position:relative}
.chart svg{width:100%;height:240px;display:block}
.hover{position:absolute;pointer-events:none;background:var(--tx);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 0;border:1px solid var(--ln);border-radius:16px;background:var(--card);overflow:hidden}
.kpis div{padding:16px 18px;border-right:1px solid var(--ln)}.kpis div:last-child{border:0}.kpis span{color:var(--mu);font-size:12.5px}.kpis b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em}.kpis em{font:12px 'Geist Mono';font-style:normal;color:#16a34a}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}.box h3{margin:0;padding:14px 18px;font-size:14px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between}.box h3 a{color:var(--mu);font-weight:500;text-decoration:none}
table{width:100%;border-collapse:collapse}td{padding:11px 18px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border:0}
.pill{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px}.p-paid{background:#e8f7ee;color:#15803d}.p-ful{background:var(--fxbg);color:var(--fx)}.p-ref{background:#f3f3f3;color:var(--mu)}
.prod{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ln)}.prod:last-child{border:0}.prod i{width:40px;height:40px;border-radius:10px;flex:none}
.prod div{flex:1}.prod small{display:block;color:var(--mu)}.spark{width:70px;height:24px}
.live{display:inline-flex;align-items:center;gap:6px;font:12px 'Geist Mono';color:var(--fx)}.live i{width:7px;height:7px;border-radius:50%;background:var(--fx);animation:b 1.2s infinite}@keyframes b{50%{opacity:.3}}
@media(max-width:1000px){body{grid-template-columns:1fr}aside{display:none}.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.box{overflow-x:auto}main{padding:20px 16px}}
</style>
<script>if(window===window.top)document.head.appendChild(Object.assign(document.createElement("script"),{defer:true,src:"/_vercel/insights/script.js"}))</script>
</head>
<body>
<aside><div class="st"><i>E</i><div><b>Ember & Oak</b><small>ember-oak.shop</small></div></div>
 <a class="on" href="#">Home</a><a href="#">Orders <span>14</span></a><a href="#">Products <span>38</span></a><a href="#">Customers</a><a href="#">Subscriptions <span>412</span></a><a href="#">Discounts</a><a href="#">Analytics</a><a href="#">Settings</a></aside>
<main>
 <div class="hd"><div><h1>Revenue · <span class="live"><i></i>3 people on the store</span></h1><div class="rev" id="rev">€48,214<small>▲ 18.4%</small></div></div><div class="range" id="rg"><button>Today</button><button class="on">30 days</button><button>Quarter</button><button>Year</button></div></div>
 <div class="chart"><svg viewBox="0 0 900 240" id="ch" preserveAspectRatio="none"></svg><div class="hover" id="hv"></div></div>
 <div class="kpis"><div><span>Orders</span><b>1,126</b><em>▲ 12%</em></div><div><span>Avg. order</span><b>€42.82</b><em>▲ 5.7%</em></div><div><span>Conversion</span><b>3.4%</b><em>▲ 0.4 pts</em></div><div><span>Returning</span><b>61%</b><em>▲ 3 pts</em></div></div>
 <div class="two"><div class="box"><h3>Latest orders <a href="#">View all →</a></h3><table id="ord"></table></div>
  <div class="box"><h3>Top sellers <a href="#">30 days</a></h3><div id="top"></div></div></div>
</main>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none">← 50 SaaS</a>
<script>
const N=30,cur=[],prev=[];for(let i=0;i<N;i++){cur.push(1200+Math.sin(i/3)*300+i*28+((i*37)%11)*40+(i%7===5?600:0));prev.push(1100+Math.sin(i/3+1)*260+i*14+((i*53)%9)*30)}
const mx=Math.max(...cur,...prev)*1.1,X=i=>i/(N-1)*900,Y=v=>230-v/mx*210;
const path=a=>a.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ');
const ch=document.getElementById('ch');ch.innerHTML=[0,1,2,3].map(k=>`<line x1="0" x2="900" y1="${20+k*70}" y2="${20+k*70}" stroke="#f0f0f0"/>`).join('')+`<path d="${path(prev)}" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="5 6" vector-effect="non-scaling-stroke"/><path d="${path(cur)} L900 240 L0 240 Z" fill="url(#gr)"/><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6246e" stop-opacity=".18"/><stop offset="1" stop-color="#d6246e" stop-opacity="0"/></linearGradient></defs><path d="${path(cur)}" fill="none" stroke="#d6246e" stroke-width="2.6" vector-effect="non-scaling-stroke"/><line id="vl" x1="0" x2="0" y1="0" y2="240" stroke="#0d0d0d" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>`;
const hv=document.getElementById('hv');ch.onmousemove=e=>{const r=ch.getBoundingClientRect();const i=Math.round((e.clientX-r.left)/r.width*(N-1));const d=new Date(2026,8,2+i);document.getElementById('vl').setAttribute('x1',X(i));document.getElementById('vl').setAttribute('x2',X(i));document.getElementById('vl').setAttribute('opacity',1);
 hv.style.left=(X(i)/900*r.width+18)+'px';hv.style.top=(Y(cur[i])/240*r.height+18)+'px';hv.style.opacity=1;hv.innerHTML=`<b>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</b> · €${Math.round(cur[i]).toLocaleString()}<br><span style="opacity:.6">prev. period €${Math.round(prev[i]).toLocaleString()}</span>`};
ch.onmouseleave=()=>{hv.style.opacity=0;document.getElementById('vl').setAttribute('opacity',0)};
const O=[['#4821','Mara Lindqvist','Autumn roast ×2','€38.00','p-ful','Unfulfilled'],['#4820','Theo Martin','Subscription · Espresso','€19.00','p-paid','Paid'],['#4819','Aiko Mori','Grinder · Comandante','€249.00','p-paid','Paid'],['#4818','Sam Okoro','Gift box','€64.00','p-ful','Unfulfilled'],['#4817','Lena Fischer','Decaf ×1','€14.50','p-ref','Refunded']];
document.getElementById('ord').innerHTML=O.map(o=>`<tr><td class="mono">${o[0]}</td><td>${o[1]}</td><td style="color:var(--mu)">${o[2]}</td><td class="mono">${o[3]}</td><td><span class="pill ${o[4]}">${o[5]}</span></td></tr>`).join('');
const T=[['Autumn roast 250g','#c46a3a','€9,840 · 562 sold'],['Espresso subscription','#3a2a1d','€7,828 · 412 subs'],['Comandante C40','#7a7a7a','€4,980 · 20 sold'],['Ethiopia Guji 250g','#d9a441','€3,110 · 214 sold']];
document.getElementById('top').innerHTML=T.map((t,k)=>{let p='';for(let i=0;i<12;i++)p+=`${i*6},${22-(Math.sin(i/2+k)*6+i*.9+6)} `;return`<div class="prod"><i style="background:${t[1]}"></i><div><b>${t[0]}</b><small>${t[2]}</small></div><svg class="spark" viewBox="0 0 70 24"><polyline points="${p}" fill="none" stroke="#d6246e" stroke-width="1.8"/></svg></div>`}).join('');
document.getElementById('rg').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#rg button').forEach(x=>x.classList.toggle('on',x===b));const v={Today:'€1,912',['30 days']:'€48,214',Quarter:'€139,660',Year:'€512,904'}[b.textContent];document.getElementById('rev').firstChild.textContent=v};
</script>
</body>
</html>
