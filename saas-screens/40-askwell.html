<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Askwell — Customer pulse survey</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#1d3b2a;--tx:#f4efe2;--acc:#f4c95d}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 'Plus Jakarta Sans',sans-serif;transition:background .8s,color .8s;overflow:hidden}
.bar{position:fixed;left:0;top:0;height:5px;background:var(--acc);transition:width .5s,background .8s;z-index:3}
.brand{position:fixed;left:32px;top:24px;font:600 14px 'Plus Jakarta Sans';opacity:.75;display:flex;gap:8px;align-items:center}.brand i{width:16px;height:16px;border-radius:50%;background:var(--acc)}
.stage{height:100%;display:grid;place-items:center;padding:0 24px}
.q{width:min(760px,100%);animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(40px)}}
.q.out{animation:out .35s forwards}@keyframes out{to{opacity:0;transform:translateY(-40px)}}
.n{font:600 15px 'Plus Jakarta Sans';color:var(--acc);display:flex;gap:8px;align-items:center;margin-bottom:12px}
h1{font:400 clamp(32px,4.6vw,56px)/1.1 'Gloock',serif;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.hint{opacity:.65;margin:0 0 28px}
.opts{display:grid;gap:10px;max-width:520px}
.opt{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid color-mix(in srgb,var(--tx) 30%,transparent);border-radius:12px;cursor:pointer;background:color-mix(in srgb,var(--tx) 6%,transparent);transition:.15s;font-size:18px}
.opt:hover{background:color-mix(in srgb,var(--tx) 14%,transparent)}.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.opt kbd{width:28px;height:28px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--tx) 40%,transparent);display:grid;place-items:center;font:600 13px 'Plus Jakarta Sans'}
.opt.sel kbd{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;max-width:700px}
.scale button{aspect-ratio:1;border:1.5px solid color-mix(in srgb,var(--tx) 30%,transparent);background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx);border-radius:10px;font:700 18px 'Plus Jakarta Sans';cursor:pointer;transition:.15s}
.scale button:hover{transform:translateY(-3px)}.scale button.sel{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.ends{display:flex;justify-content:space-between;max-width:700px;font-size:14px;opacity:.65;margin-top:8px}
textarea{width:100%;max-width:640px;background:transparent;border:0;border-bottom:2px solid color-mix(in srgb,var(--tx) 40%,transparent);color:var(--tx);font:400 26px/1.4 'Gloock';padding:8px 0;resize:none;outline:none;height:120px}
textarea:focus{border-color:var(--acc)}
.ok{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:12px 20px;font:700 17px 'Plus Jakarta Sans';cursor:pointer}
.ok span{font-weight:400;font-size:13px;opacity:.75}
.nav{position:fixed;right:24px;bottom:24px;display:flex;gap:4px;z-index:3}.nav button{width:40px;height:40px;border:0;border-radius:8px;background:var(--acc);color:var(--bg);font-size:16px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:640px}.chips .opt{padding:10px 14px}
@media(max-width:640px){.scale{grid-template-columns:repeat(6,1fr)}.brand{left:16px}}
</style>
</head>
<body>
<div class="bar" id="bar"></div><div class="brand"><i></i>Fernway · 2-minute check-in</div>
<div class="stage"><div id="q"></div></div>
<div class="nav"><button id="up">↑</button><button id="dn">↓</button></div>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:#111;text-decoration:none">← 50 SaaS</a>
<script>
const TH=[['#1d3b2a','#f4efe2','#f4c95d'],['#f4efe2','#1d2a3b','#e2603b'],['#2b2340','#f1ecff','#9ee6c5'],['#ffd6c2','#3a1d14','#1d3b2a'],['#10223a','#e7f0ff','#ffb14e'],['#1d3b2a','#f4efe2','#f4c95d']];
const Q=[{t:'intro',h:'Hi Mara — got two minutes to make Fernway better?',p:'Five questions. Your answers go straight to the product team, not to sales.',b:'Let’s go'},
{t:'scale',h:'How likely are you to recommend Fernway to a colleague?',p:'0 is “absolutely not”, 10 is “already did”.'},
{t:'choice',h:'What do you mostly use Fernway for?',p:'Pick one — the one you’d miss most.',o:['Writing docs with my team','Planning projects','Meeting notes','Client portals']},
{t:'multi',h:'Which of these slow you down?',p:'Choose as many as you like.',o:['Search','Permissions','Mobile app','Templates','Notifications','Exporting']},
{t:'text',h:'If you could change one thing tomorrow, what would it be?',p:'Shift ↵ for a new line.'},
{t:'end',h:'Thank you, Mara. Genuinely.',p:'We read every answer. If you mentioned something specific, someone from the team may reply within a week.'}];
let i=0;const A={};const $=s=>document.getElementById(s);
function theme(k){const t=TH[k%TH.length];document.body.style.background=t[0];document.body.style.color=t[1];document.documentElement.style.setProperty('--bg',t[0]);document.documentElement.style.setProperty('--tx',t[1]);document.documentElement.style.setProperty('--acc',t[2])}
function render(){const q=Q[i];theme(i);$('bar').style.width=(i/(Q.length-1)*100)+'%';let body='';
 if(q.t==='scale')body=`<div class="scale">${Array.from({length:11},(_,n)=>`<button class="${A[i]===n?'sel':''}" data-v="${n}">${n}</button>`).join('')}</div><div class="ends"><span>Not likely</span><span>Very likely</span></div>`;
 if(q.t==='choice')body=`<div class="opts">${q.o.map((o,n)=>`<div class="opt ${A[i]===n?'sel':''}" data-v="${n}"><kbd>${'ABCD'[n]}</kbd>${o}</div>`).join('')}</div>`;
 if(q.t==='multi')body=`<div class="chips">${q.o.map((o,n)=>`<div class="opt ${(A[i]||[]).includes(n)?'sel':''}" data-m="${n}"><kbd>${'ABCDEF'[n]}</kbd>${o}</div>`).join('')}</div>`;
 if(q.t==='text')body=`<textarea id="ta" placeholder="Type your answer here…">${A[i]||''}</textarea>`;
 const btn=q.t==='end'?'':`<button class="ok" id="ok">${q.b||'OK ✓'} <span>press Enter ↵</span></button>`;
 $('q').innerHTML=`<div class="q">${q.t!=='intro'&&q.t!=='end'?`<div class="n">${i} →</div>`:''}<h1>${q.h}</h1><p class="hint">${q.p}</p>${body}${btn}${q.t==='end'?'<div style="font-size:70px;margin-top:10px">🌿</div>':''}</div>`;
 const ta=$('ta');if(ta){ta.focus();ta.oninput=()=>A[i]=ta.value}}
function go(d){const n=Math.max(0,Math.min(Q.length-1,i+d));if(n===i)return;const el=document.querySelector('.q');el.classList.add('out');setTimeout(()=>{i=n;render()},300)}
document.addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(v){A[i]=+v.dataset.v;render();setTimeout(()=>go(1),380);return}const m=e.target.closest('[data-m]');if(m){const a=A[i]=A[i]||[];const n=+m.dataset.m;a.includes(n)?a.splice(a.indexOf(n),1):a.push(n);render();return}if(e.target.closest('#ok'))go(1)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go(1)}const q=Q[i];if(document.activeElement.tagName==='TEXTAREA')return;const k=e.key.toUpperCase();
 if(q.t==='choice'&&'ABCD'.includes(k)&&k.length===1){A[i]='ABCD'.indexOf(k);render();setTimeout(()=>go(1),380)}if(q.t==='multi'&&'ABCDEF'.includes(k)&&k.length===1){const a=A[i]=A[i]||[];const n='ABCDEF'.indexOf(k);a.includes(n)?a.splice(a.indexOf(n),1):a.push(n);render()}
 if(q.t==='scale'&&/^\d$/.test(e.key)){A[i]=+e.key;render();setTimeout(()=>go(1),380)}if(e.key==='ArrowDown')go(1);if(e.key==='ArrowUp')go(-1)});
$('up').onclick=()=>go(-1);$('dn').onclick=()=>go(1);render();
</script>
</body>
</html>
