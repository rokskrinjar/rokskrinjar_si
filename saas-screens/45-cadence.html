<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence — Sequence: Mid-market outbound</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#0f1b2d;--bg2:#15243b;--ln:#2a3c58;--gold:#d8b46a;--cream:#f3ead8;--mu:#8e9bb3;--em:#7fb3ff;--call:#f08a6c;--li:#9fd8b5;--wait:#4c5f80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px/1.5 'Sora',sans-serif}
header{display:flex;align-items:center;gap:16px;padding:18px 32px;border-bottom:1px solid var(--ln)}
.lg{font:700 26px 'Cormorant Garamond';letter-spacing:.02em;display:flex;align-items:center;gap:8px}.lg i{font-style:normal;color:var(--gold);font-size:28px}
header .sp{flex:1}.st{display:flex;align-items:center;gap:8px;color:var(--li);font-size:13px}.st i{width:8px;height:8px;border-radius:50%;background:var(--li)}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:8px 16px;font:600 13px 'Sora';cursor:pointer}
.head{padding:34px 32px 10px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
h1{font:600 clamp(36px,4.6vw,58px)/1 'Cormorant Garamond';margin:0;letter-spacing:-.01em}h1 i{color:var(--gold)}
.head p{color:var(--mu);margin:8px 0 0}
.kp{display:flex;gap:30px}.kp div span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.kp div b{font:600 34px 'Cormorant Garamond'}
.score{margin:20px 32px;background:var(--bg2);border:1px solid var(--ln);border-radius:20px;padding:26px 24px 20px;overflow-x:auto}
.staff{position:relative;height:200px;min-width:900px}
.line{position:absolute;left:0;right:0;height:1px;background:var(--ln)}
.clef{position:absolute;left:0;top:30px;font:500 120px/1 'Cormorant Garamond';color:var(--gold);opacity:.8}
.note{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;transition:transform .2s}
.note:hover,.note.sel{transform:translate(-50%,-50%) scale(1.12)}
.note .hd{width:46px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--bg);transform:rotate(-18deg);margin:0 auto;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.note .hd span{transform:rotate(18deg)}
.note .stem{position:absolute;right:2px;bottom:16px;width:2px;height:60px;background:currentColor}
.note small{display:block;margin-top:8px;font-size:11px;color:var(--mu);white-space:nowrap}
.note.sel .hd{outline:2px solid var(--gold);outline-offset:4px}
.rest{position:absolute;transform:translate(-50%,-50%);font:600 13px 'Sora';color:var(--wait);text-align:center}.rest b{display:block;font:500 34px/1 'Cormorant Garamond';color:var(--wait)}
.bars{display:flex;margin-top:22px;min-width:900px;padding-left:120px}.bars div{flex:1;text-align:center}.bars i{display:block;margin:0 auto 6px;width:60%;border-radius:4px 4px 0 0;background:linear-gradient(var(--gold),#8f733b)}.bars span{font-size:11px;color:var(--mu)}
.det{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 32px 60px}
.box{background:var(--bg2);border:1px solid var(--ln);border-radius:20px;padding:22px}
.box h3{font:600 24px 'Cormorant Garamond';margin:0 0 4px}.box .k{color:var(--mu);font-size:12.5px}
.mail{background:var(--cream);color:#1d2638;border-radius:12px;padding:16px;margin-top:14px;font-size:14px;line-height:1.6}
.mail b{display:block;margin-bottom:6px}.mail .v{background:#fff1c9;border-radius:4px;padding:0 4px;color:#7a5a12;font-weight:600}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ab div{border:1px solid var(--ln);border-radius:12px;padding:12px}.ab div.win{border-color:var(--gold)}.ab b{font:600 26px 'Cormorant Garamond';display:block}.ab span{color:var(--mu);font-size:12px}
.pp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--ln)}.pp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--bg)}.pp small{color:var(--mu);margin-left:auto}
@media(max-width:900px){.det{grid-template-columns:1fr}.kp{gap:16px}}
</style>
</head>
<body>
<header><div class="lg"><i>𝄞</i>Cadence</div><span style="color:var(--mu)">Sequences / Mid-market outbound · EMEA</span><span class="sp"></span><span class="st"><i></i>Running · 412 prospects</span><button class="btn">Pause</button></header>
<div class="head"><div><h1>Eight steps, <i>sixteen days.</i></h1><p>Click a note to see the step. Height on the staff = how personal the touch is.</p></div><div class="kp"><div><span>Replied</span><b>14.2%</b></div><div><span>Meetings</span><b>38</b></div><div><span>Bounced</span><b>1.1%</b></div></div></div>
<div class="score"><div class="staff" id="staff"></div><div class="bars" id="bars"></div></div>
<div class="det"><div class="box" id="step"></div><div class="box"><h3>Who’s at this step</h3><div class="k">Next to send, in send order</div><div id="ppl"></div></div></div>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:#111;text-decoration:none">← 50 SaaS</a>
<script>
const S=[['em','✉','Day 1','Intro email','Quick question about {{company}}’s onboarding',2,41,8.1],['li','in','Day 2','LinkedIn connect','Personal note, no pitch',3,0,0],['wait','','','Wait 2 days'],['em','✉','Day 4','Follow-up','The 3-minute version',2,38,3.2],['call','☏','Day 6','Call','Talk track: retention benchmark',4,0,0],['wait','','','Wait 3 days'],['em','✉','Day 9','Case study','How Calder cut onboarding to 5 min',2,33,1.9],['li','in','Day 12','LinkedIn message','Comment on their latest post',3,0,0],['em','✉','Day 16','Breakup','Should I close your file?',1,29,2.4]];
const COL={em:'var(--em)',call:'var(--call)',li:'var(--li)'};let sel=0;const $=s=>document.getElementById(s);
function staff(){let h='';for(let k=0;k<5;k++)h+=`<div class="line" style="top:${40+k*28}px"></div>`;h+='<div class="clef">𝄞</div>';
 S.forEach((s,i)=>{const x=10+(i+.5)/S.length*88;if(s[0]==='wait'){h+=`<div class="rest" style="left:${x}%;top:96px"><b>𝄽</b>${s[3]}</div>`;return}const y=40+(5-s[5])*28;h+=`<div class="note ${i===sel?'sel':''}" data-i="${i}" style="left:${x}%;top:${y}px;color:${COL[s[0]]}"><div class="hd" style="background:${COL[s[0]]}"><span>${s[1]}</span></div><small>${s[2]} · ${s[3]}</small></div>`});
 $('staff').innerHTML=h;$('bars').innerHTML=S.map(s=>s[0]==='wait'?'<div></div>':`<div><i style="height:${(s[7]||1.2)*9}px"></i><span>${s[7]?s[7]+'% reply':'—'}</span></div>`).join('')}
function step(){const s=S[sel];$('step').innerHTML=`<div class="k">${s[2]} · ${s[0]==='em'?'Automatic email':s[0]==='call'?'Manual call task':'Manual LinkedIn task'}</div><h3>${s[3]}</h3>${s[0]==='em'?`<div class="mail"><b>Subject: ${s[4].replace('{{company}}','<span class="v">{{company}}</span>')}</b>Hi <span class="v">{{first_name}}</span> — noticed <span class="v">{{company}}</span> grew to <span class="v">{{headcount}}</span> people this year. Teams that size usually hit the same wall: new hires take weeks to find anything. We helped Calder Labs get that down to 5 minutes. Worth a quick chat?</div><div class="ab"><div class="win"><span>Variant A · winning</span><b>${s[6]}% open</b><span>${s[7]}% reply</span></div><div><span>Variant B</span><b>${s[6]-6}% open</b><span>${(s[7]*.7).toFixed(1)}% reply</span></div></div>`:`<p style="color:var(--mu)">${s[4]}. Tasks land in the rep’s queue at 09:00 local time, with the prospect’s recent activity attached.</p>`}`;
 const P=[['Hana Sato','Kilnworks','#7fb3ff'],['Lukas Weber','Fjord Energy','#f08a6c'],['Aiko Mori','Velo Mobility','#9fd8b5'],['Sara Lind','Halden Bank','#d8b46a']];$('ppl').innerHTML=P.map((p,k)=>`<div class="pp"><i style="background:${p[2]}">${p[0].split(' ').map(x=>x[0]).join('')}</i><div><b>${p[0]}</b><br><span style="color:var(--mu);font-size:12px">${p[1]}</span></div><small>${['in 12 min','09:00 tmrw','09:00 tmrw','Fri'][k]}</small></div>`).join('')}
$('staff').onclick=e=>{const n=e.target.closest('[data-i]');if(n){sel=+n.dataset.i;staff();step()}};staff();step();
</script>
</body>
</html>
