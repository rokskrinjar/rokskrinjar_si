<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaultline — Team vault</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>html.embed .bk{display:none!important}</style><script>try{if(self!==parent||location.hash=='#t')document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
:root{--bg:#e4e7ea;--steel:linear-gradient(180deg,#f7f8f9,#dfe3e7);--tx:#1c2228;--mu:#6c7680;--ln:#cdd3d9;--red:#c8102e;--grn:#178f5a;--amb:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Exo 2',sans-serif;min-height:100vh}
.mono{font-family:'Overpass Mono',monospace}
header{display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--steel);border-bottom:1px solid var(--ln);box-shadow:inset 0 -1px 0 #fff}
.lg{font:800 18px 'Exo 2';letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.dial{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,#9aa3ab,#eef1f3,#9aa3ab,#eef1f3,#9aa3ab);border:2px solid #7d868e;position:relative}.dial::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--red)}
.srch{flex:0 1 420px;margin-left:30px;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:14px 'Exo 2';background:#fff}
header .sp{flex:1}.lock{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:8px 12px;font:600 13px 'Exo 2';cursor:pointer}
.lay{display:grid;grid-template-columns:230px 360px 1fr;height:calc(100vh - 61px)}
.nav{padding:16px 12px;border-right:1px solid var(--ln)}.nav a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-weight:500}.nav a.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}.nav a span{color:var(--mu);font-size:12px}
.nav h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:16px 10px 6px}
.health{margin:18px 6px 0;background:var(--steel);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:center}
.health b{font:800 38px 'Exo 2';display:block;line-height:1}.health .ring{width:100px;height:100px;margin:0 auto 6px;border-radius:50%;background:conic-gradient(var(--grn) 0 82%,#cdd3d9 82%);display:grid;place-items:center}.health .ring div{width:78px;height:78px;border-radius:50%;background:#eef1f3;display:grid;place-items:center}
.list{border-right:1px solid var(--ln);overflow:auto;background:#eef0f2}
.it{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);cursor:pointer}.it.on{background:#fff}
.it .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.it div{flex:1;min-width:0}.it small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font:600 10.5px 'Exo 2';padding:2px 6px;border-radius:5px;background:#fbe3e7;color:var(--red)}.flag.w{background:#fdf0dc;color:var(--amb)}
.det{overflow:auto;padding:26px 32px;background:#f6f7f8}
.dh{display:flex;gap:16px;align-items:center}.dh .ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;color:#fff;font:800 24px 'Exo 2'}
.dh h1{margin:0;font-size:26px}.dh p{margin:0;color:var(--mu)}
.alert{margin:18px 0;background:#fff;border:1px solid #f3c2cb;border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.alert button{margin-left:auto;border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 12px;font:700 13px 'Exo 2';cursor:pointer}
.fld{background:#fff;border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
.f{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}.f:last-child{border:0}
.f span{color:var(--mu);font-size:12.5px}.f .v{font:15px 'Overpass Mono';word-break:break-all}
.f button{border:1px solid var(--ln);background:#fff;border-radius:7px;padding:5px 9px;font:600 12px 'Exo 2';cursor:pointer;margin-left:4px}
.str{height:6px;border-radius:3px;background:#e3e7ea;margin-top:6px;overflow:hidden;width:180px}.str i{display:block;height:100%}
.totp{display:flex;align-items:center;gap:10px}.totp svg{width:22px;height:22px;transform:rotate(-90deg)}
.share{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.share span{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}.share i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff;font-weight:700}
h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.hist{font-size:13px;color:var(--mu)}.hist div{padding:5px 0;border-bottom:1px dashed var(--ln)}.hist b{color:var(--tx)}
@media(max-width:1100px){.lay{grid-template-columns:300px 1fr;height:auto}.nav{display:none}.srch{display:none}}@media(max-width:760px){.lay{grid-template-columns:1fr}.list{max-height:300px}}
</style>
<script>if(window===window.top)document.head.appendChild(Object.assign(document.createElement("script"),{defer:true,src:"/_vercel/insights/script.js"}))</script>
</head>
<body>
<header><div class="lg"><span class="dial"></span>VAULTLINE</div><input class="srch" placeholder="Search 1,284 items…  ⌘K"><span class="sp"></span><span style="color:var(--mu);font-size:13px">🔒 Auto-locks in 14:59</span><button class="lock">Lock vault</button></header>
<div class="lay">
 <nav class="nav"><a class="on" href="#">All items <span>1,284</span></a><a href="#">Favourites <span>18</span></a><a href="#">Watchtower <span style="color:var(--red)">5</span></a><h5>Shared vaults</h5><a href="#">Engineering <span>412</span></a><a href="#">Finance <span>96</span></a><a href="#">Marketing <span>141</span></a><a href="#">Private <span>63</span></a>
  <div class="health"><div class="ring"><div><b>82</b></div></div><b style="font-size:14px">Team security score</b><span style="color:var(--mu);font-size:12px">+6 since last month</span></div></nav>
 <section class="list" id="list"></section>
 <section class="det" id="det"></section>
</div>
<a class="bk" href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;text-decoration:none">← 50 SaaS</a>
<script>
const V=[['AWS root (prod)','ops@fernway.example','#ff9900','A','Engineering','k7#Rq2!vX9mPz$4LtW8n',95,''],['Stripe dashboard','finance@fernway.example','#635bff','S','Finance','Fernway2021!',22,'breach'],['Figma','design@fernway.example','#0acf83','F','Marketing','tulip-orbit-cactus-91',78,'reused'],['GitHub org owner','cto@fernway.example','#24292f','G','Engineering','Q!8vz#pL0@rT2mXk6yH3',98,''],['Google Workspace admin','it@fernway.example','#4285f4','G','Engineering','winter-copper-lantern-7',81,''],['LinkedIn company page','social@fernway.example','#0a66c2','in','Marketing','Fernway2021!',22,'reused'],['Xero','finance@fernway.example','#13b5ea','X','Finance','m2#Kd9!Lq',66,'old']];
let sel=1,show=false;const $=s=>document.getElementById(s);
function list(){$('list').innerHTML=V.map((v,i)=>`<div class="it ${i===sel?'on':''}" data-i="${i}"><span class="ic" style="background:${v[2]}">${v[3]}</span><div><b>${v[0]}</b><small>${v[1]}</small></div>${v[7]==='breach'?'<span class="flag">Breached</span>':v[7]==='reused'?'<span class="flag w">Reused</span>':v[7]==='old'?'<span class="flag w">2 yrs old</span>':''}</div>`).join('')}
let tick=0;
function det(){const v=V[sel];const col=v[6]>80?'var(--grn)':v[6]>50?'var(--amb)':'var(--red)';const code=String(100000+((sel*7919+Math.floor(Date.now()/30000)*104729)%900000)).slice(0,6);
 $('det').innerHTML=`<div class="dh"><span class="ic" style="background:${v[2]}">${v[3]}</span><div><h1>${v[0]}</h1><p>${v[4]} vault · edited 12 days ago</p></div></div>
 ${v[7]==='breach'?`<div class="alert"><span style="font-size:22px">⚠</span><div><b>This password appeared in a data breach</b><br><span style="color:var(--mu);font-size:13px">Found in a 2024 credential dump. It’s also used on 1 other item.</span></div><button id="fix">Generate & replace</button></div>`:v[7]?`<div class="alert" style="border-color:#f3dcb8;border-left-color:var(--amb)"><span style="font-size:22px">!</span><div><b>${v[7]==='reused'?'Reused password':'Not changed in 2 years'}</b><br><span style="color:var(--mu);font-size:13px">Rotate it to raise your security score.</span></div><button id="fix" style="background:var(--amb)">Rotate</button></div>`:'<div style="height:18px"></div>'}
 <div class="fld"><div class="f"><span>Username</span><span class="v">${v[1]}</span><span><button>Copy</button></span></div>
  <div class="f"><span>Password</span><div><span class="v">${show?v[5]:'•'.repeat(16)}</span><div class="str"><i style="width:${v[6]}%;background:${col}"></i></div></div><span><button id="rv">${show?'Hide':'Reveal'}</button><button id="cp">Copy</button></span></div>
  <div class="f"><span>One-time code</span><div class="totp"><span class="v" style="font-size:20px;letter-spacing:.12em">${code.slice(0,3)} ${code.slice(3)}</span><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#e3e7ea" stroke-width="5"/><circle id="tc" cx="18" cy="18" r="15" fill="none" stroke="#178f5a" stroke-width="5" stroke-dasharray="94.2" stroke-dashoffset="0"/></svg></div><span><button>Copy</button></span></div>
  <div class="f"><span>Website</span><span class="v" style="font-size:13px">https://dashboard.${v[0].split(' ')[0].toLowerCase()}.com</span><span><button>Open ↗</button></span></div></div>
 <h4>Shared with</h4><div class="share"><span><i style="background:#3d6fb6">MR</i>Marta R.</span><span><i style="background:#c06c84">DO</i>Dayo O.</span><span><i style="background:#5b8c5a">FN</i>Finance team (6)</span></div>
 <h4>Activity</h4><div class="hist"><div><b>Dayo</b> copied password · 2 days ago</div><div><b>Marta</b> viewed · 12 days ago</div><div><b>SCIM</b> removed access for <b>ex-employee</b> · 3 weeks ago</div></div>`;
 $('rv').onclick=()=>{show=!show;det()};$('cp').onclick=e=>{e.target.textContent='Copied · clears in 30s'};
 const f=$('fix');if(f)f.onclick=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!#$%@';v[5]=Array.from({length:20},()=>c[Math.floor(Math.random()*c.length)]).join('');v[6]=97;v[7]='';show=true;list();det()}}
$('list').onclick=e=>{const it=e.target.closest('.it');if(it){sel=+it.dataset.i;show=false;list();det()}};
setInterval(()=>{const c=document.getElementById('tc');if(c){const p=(Date.now()/1000%30)/30;c.setAttribute('stroke-dashoffset',94.2*p);c.setAttribute('stroke',p>.8?'#c8102e':'#178f5a')}},250);
list();det();
</script>
</body>
</html>
