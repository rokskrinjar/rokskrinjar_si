.k{font:700 11.5px Roboto,Arial;letter-spacing:.12em;text-transform:uppercase;color:#cc0000}h1{font:800 26px/1.05 'Roboto Condensed','Arial Narrow',Arial;text-transform:uppercase;margin:6px 0 8px}

</head><body><main class="c" id="gate" hidden><span class="k">Würth Slovenija · zaščiteno</span><h1>Komplementarni izdelki</h1>
<p>Stran uporablja zaupne prodajne podatke in je zaščitena z geslom. Geslo velja za vse zaščitene strani do zaprtja zavihka.</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" aria-label="Geslo" placeholder="Geslo" required><button>Odkleni</button></form><div class="e" id="e"></div><a href="index.html">← Vse analize</a></main>
<script>
(async()=>{const SALT=Uint8Array.from(atob('0PS/rTPIxGObz7oYsNrSzg=='),c=>c.charCodeAt(0)),ITER=310000,BIN='secure/'+location.pathname.split('/').pop().replace(/\.html$/,'')+'.bin';
const g=document.getElementById('gate');
async function open(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const b=new Uint8Array(await (await fetch(BIN,{cache:'no-cache'})).arrayBuffer());
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},base,256))}
let saved=null;try{saved=sessionStorage.getItem('wso-k')}catch(e){}
if(saved){try{await open(Uint8Array.from(atob(saved),c=>c.charCodeAt(0)));return}catch(e){try{sessionStorage.removeItem('wso-k')}catch(_){}}}
g.hidden=false;document.getElementById('pw').focus();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Preverjam …';
 try{const raw=await derive(document.getElementById('pw').value);await open(raw);try{sessionStorage.setItem('wso-k',btoa(String.fromCharCode(...raw)))}catch(_){}}
 catch(x){e.textContent='Napačno geslo.'}})})();
</script></body></html>
